ated":[],"copy":"Clase 19 - PENDIENTE DE REVISION.mp4"}],"glossary":[{"term":"Futuros (Futures)","category":"Futuros","definition":"Contrato estandarizado que toma como referencia un subyacente y fija condiciones de vencimiento y liquidación.","example":"Un futuro sobre un índice ofrece exposición a su cotización sin comprar las acciones del índice.","related":"Tamaño de contrato · Vencimiento · Margen"},{"term":"Tamaño de contrato (Contract size)","category":"Futuros","definition":"Cantidad de subyacente o multiplicador económico definido por contrato.","example":"Si el multiplicador ilustrativo es USD 10 por punto, 2 puntos representan USD 20 por contrato.","related":"Nocional · Valor del tick"},{"term":"Tick","category":"Futuros","definition":"Mínimo incremento de precio permitido para el contrato o serie.","example":"Con tick de 0,25, pasar de 100 a 101 equivale a cuatro ticks.","related":"Tamaño de contrato · Valor del tick"},{"term":"Valor del tick (Tick value)","category":"Futuros","definition":"Cambio monetario por un tick y un contrato.","example":"Si cada tick equivale a USD 2, cinco ticks valen USD 10 brutos por contrato.","related":"Tick · Slippage · P&L"},{"term":"Valor nocional (Notional value)","category":"Futuros","definition":"Valor de la exposición de referencia que controla el contrato.","example":"Precio 500 × multiplicador USD 10 equivale a USD 5 000 de nocional ilustrativo.","related":"Tamaño de contrato · Margen"},{"term":"Margen (Margin)","category":"Futuros","definition":"Fondos exigidos como garantía para abrir o sostener exposición, conforme al mercado e intermediario.","example":"USD 100 de margen en un ejemplo pueden respaldar una exposición nocional mayor.","related":"Margen inicial · Margen de mantenimiento"},{"term":"Margen inicial (Initial margin)","category":"Futuros","definition":"Garantía requerida al establecer una posición.","example":"La ficha y el intermediario pueden mostrar requisitos distintos según el tipo de cuenta o sesión.","related":"Margen · Nocional"},{"term":"Margen de mantenimiento (Maintenance margin)","category":"Futuros","definition":"Umbral de garantía asociado a mantener la posición.","example":"Al quedar bajo el umbral, se pueden requerir fondos o reducir exposición según las condiciones aplicables.","related":"Margen inicial · Riesgo"},{"term":"Rollover","category":"Futuros","definition":"Cierre o traslado de la exposición desde un vencimiento hacia otro.","example":"Una posición referida a marzo puede trasladarse a junio mediante operaciones separadas o un spread de calendario.","related":"Vencimiento · Volumen"},{"term":"Orden de mercado (Market order)","category":"Ejecución","definition":"Orden que busca ejecutar al mejor precio disponible bajo las reglas del mercado.","example":"Una compra enviada a mercado puede llenar en varios precios con baja profundidad.","related":"Bid · Ask · Slippage"},{"term":"Orden limitada (Limit order)","category":"Ejecución","definition":"Orden con un precio máximo de compra o mínimo de venta.","example":"Una compra limitada a 100 puede quedar pendiente si solo hay vendedores a 101.","related":"Spread · Liquidez"},{"term":"Orden stop (Stop order)","category":"Ejecución","definition":"Orden que se activa cuando se cumple una condición de precio.","example":"Una stop de venta con gatillo 99 puede ejecutarse por debajo si se activa como orden de mercado.","related":"Slippage · Stop-limit"},{"term":"Slippage (deslizamiento)","category":"Ejecución","definition":"Diferencia entre el precio de referencia y el precio realmente ejecutado.","example":"Compra prevista a 100 y ejecutada a 100,25, con un tick de 0,25, tiene un tick adverso.","related":"Spread · Liquidez · Riesgo"},{"term":"Bid","category":"Ejecución","definition":"Precio al que se muestra una oferta de compra. El mejor bid es el mayor disponible en el feed.","example":"Con bid 100 y ask 101, el mejor comprador mostrado está en 100.","related":"Ask · Spread"},{"term":"Ask","category":"Ejecución","definition":"Precio al que se muestra una oferta de venta. El mejor ask es el menor disponible en el feed.","example":"Con ask 101, el vendedor más bajo visible cotiza en 101.","related":"Bid · Spread"},{"term":"Spread bid–ask","category":"Ejecución","definition":"Diferencia entre el mejor ask y el mejor bid del mismo instrumento.","example":"Con bid 100 y ask 101, el spread es 1 unidad de precio.","related":"Bid · Ask · Liquidez"},{"term":"Liquidez (Liquidity)","category":"Ejecución","definition":"Facilidad de negociar con costos y efecto sobre el precio relativamente bajos.","example":"La liquidez suele ser menor si hay poca profundidad y el spread es amplio.","related":"Spread · Slippage · Volumen"},{"term":"Estructura de mercado (Market structure)","category":"Lectura de mercado","definition":"Organización de máximos, mínimos, rangos y tendencias en un marco temporal.","example":"Máximos crecientes en diario pueden coexistir con un rango horario.","related":"Wyckoff · Temporalidad"},{"term":"Acumulación","category":"Lectura de mercado","definition":"Hipótesis Wyckoff de demanda absorbiendo oferta durante un rango o transición.","example":"Una caída rechazada y posterior recuperación aportan observaciones para contrastarla.","related":"Distribución · Absorción"},{"term":"Distribución","category":"Lectura de mercado","definition":"Hipótesis Wyckoff de oferta que gana peso a lo largo de un rango o transición.","example":"Rupturas al alza rechazadas pueden motivar una hipótesis que debe confirmarse.","related":"Acumulación · Wyckoff"},{"term":"Wyckoff","category":"Lectura de mercado","definition":"Marco de análisis de estructura, oferta, demanda y esfuerzo frente a resultado.","example":"Compara alto volumen con desplazamiento pequeño cerca de un límite de rango.","related":"Acumulación · Distribución · Volumen"},{"term":"Order Flow","category":"Lectura de mercado","definition":"Análisis de cotizaciones, órdenes y ejecuciones. Lo visible varía según la profundidad y el feed.","example":"Un footprint agrupa ejecuciones por precio y lado según el método de clasificación.","related":"Bid · Ask · Absorción"},{"term":"Absorción (Absorption)","category":"Lectura de mercado","definition":"Hipótesis de liquidez pasiva que acomoda órdenes agresivas con escaso desplazamiento.","example":"Varias ventas intensas en un nivel con poco descenso son un caso para contrastar.","related":"Order Flow · Liquidez"},{"term":"Imbalance (desequilibrio)","category":"Lectura de mercado","definition":"Diferencia marcada entre medidas de compra y venta definidas por una herramienta.","example":"Un footprint puede comparar volúmenes agresivos diagonalmente según el indicador.","related":"Order Flow · Volumen"},{"term":"Volumen (Volume)","category":"Lectura de mercado","definition":"Contratos negociados en un periodo. Una transacción bilateral se cuenta según la convención de la fuente.","example":"Una transacción de tres contratos añade tres al volumen habitual del mercado.","related":"Open Interest · Volume Profile"},{"term":"Open Interest (OI)","category":"Opciones y flujos","definition":"Contratos que siguen abiertos al corte reportado, con un largo y un corto por cada contrato.","example":"Si un titular traslada su posición a otro, aumenta el volumen y el OI puede mantenerse.","related":"Volumen · Vencimiento"},{"term":"Volume Profile","category":"Lectura de mercado","definition":"Distribución del volumen negociado por nivel o zona de precio.","example":"Dos sesiones de igual volumen pueden concentrarlo en zonas diferentes.","related":"Volumen · Liquidez"},{"term":"Option Flow","category":"Opciones y flujos","definition":"Lectura de las negociaciones registradas en series de opciones por strike, expiración y otros atributos.","example":"Una call grande cerca del ask puede ser una pierna de una estrategia compuesta.","related":"Order Flow · Prima · Open Interest"},{"term":"Call","category":"Opciones y flujos","definition":"Opción que otorga al comprador el derecho ligado a comprar el subyacente al strike o recibir el valor correspondiente según liquidación.","example":"Con strike 100 y precio final 110, el intrínseco de la call es 10 por unidad.","related":"Put · Strike · Ejercicio"},{"term":"Put","category":"Opciones y flujos","definition":"Opción que otorga al comprador el derecho ligado a vender el subyacente al strike o recibir el valor correspondiente según liquidación.","example":"Con strike 100 y precio final 92, el intrínseco de la put es 8 por unidad.","related":"Call · Strike · Ejercicio"},{"term":"Strike (precio de ejercicio)","category":"Opciones y flujos","definition":"Precio contractual usado para ejercer o calcular el valor de liquidación.","example":"Una call con strike 100 tiene intrínseco cuando el subyacente supera 100.","related":"Prima · Valor intrínseco"},{"term":"Prima (Premium)","category":"Opciones y flujos","definition":"Precio de la opción, expresado por unidad o por contrato según la ficha.","example":"Si cotiza 4 por unidad y el multiplicador es 10, el desembolso bruto es 40.","related":"Valor intrínseco · Valor extrínseco"},{"term":"Vencimiento (Expiration)","category":"Opciones y flujos","definition":"Fecha y condiciones en que termina la vigencia de un contrato o una serie.","example":"Dos calls con el mismo strike pueden tener distinto precio si vencen en fechas diferentes.","related":"Rollover · Theta"},{"term":"Valor intrínseco (Intrinsic value)","category":"Opciones y flujos","definition":"Parte de la prima que corresponde al valor favorable de ejercicio inmediato en la comparación teórica.","example":"Call con subyacente 108 y strike 100 tiene intrínseco 8 por unidad.","related":"Prima · Strike · Valor extrínseco"},{"term":"Valor extrínseco (Extrinsic value)","category":"Opciones y flujos","definition":"Diferencia entre la prima y su valor intrínseco bajo la convención usada.","example":"Prima 10 e intrínseco 8 dejan 2 unidades extrínsecas.","related":"Prima · Theta · Volatilidad implícita"},{"term":"Delta","category":"Opciones y flujos","definition":"Sensibilidad local de la prima al precio del subyacente.","example":"Delta 0,50 aproxima +0,50 en la prima para un pequeño avance de 1 con otros factores constantes.","related":"Gamma · Greeks"},{"term":"Gamma","category":"Opciones y flujos","definition":"Sensibilidad local de delta a un cambio del subyacente.","example":"Con gamma 0,04, un avance pequeño de 1 aproxima un aumento de 0,04 en delta.","related":"Delta · Gamma Exposure"},{"term":"Theta","category":"Opciones y flujos","definition":"Sensibilidad de la prima al paso del tiempo según la unidad de la fuente.","example":"Theta de −0,03 por día aproxima una caída de 0,03 manteniendo demás factores constantes.","related":"Vencimiento · Prima"},{"term":"Vega","category":"Opciones y flujos","definition":"Sensibilidad de la prima a la volatilidad implícita según la unidad reportada.","example":"Vega 0,10 por punto de IV aproxima un aumento de 0,10 si la IV sube un punto.","related":"IV · Prima"},{"term":"Volatilidad implícita (IV)","category":"Opciones y flujos","definition":"Volatilidad que un modelo recupera del precio de la opción dados sus insumos.","example":"La IV de dos strikes con igual vencimiento puede diferir, formando un skew.","related":"Vega · Expected Move"},{"term":"Expected Move","category":"Opciones y flujos","definition":"Estimación de magnitud de movimiento para un horizonte según método, precio y opciones.","example":"Se puede aproximar con precio × IV anual × raíz de la fracción del año, usando una convención documentada.","related":"IV · Vencimiento"},{"term":"Gamma Exposure (GEX)","category":"Opciones y flujos","definition":"Exposición gamma agregada estimada con supuestos sobre posiciones, escala y vencimientos.","example":"Dos proveedores pueden reportar signos distintos al imputar exposiciones diferentes.","related":"Gamma · Gamma Flip"},{"term":"Gamma Flip","category":"Opciones y flujos","definition":"Nivel estimado donde la exposición agregada cambia de signo en un modelo.","example":"Si el mapa va de GEX negativo en 99 a positivo en 101, el cruce estimado estaría entre esos niveles bajo el modelo.","related":"GEX · Open Interest"},{"term":"Call Wall","category":"Opciones y flujos","definition":"Referencia de concentración de calls o exposición de calls, definida por cada proveedor.","example":"El strike con mayor gamma de calls puede cambiar de una fecha a otra.","related":"Call · GEX · Put Wall"},{"term":"Put Wall","category":"Opciones y flujos","definition":"Referencia de concentración de puts o exposición de puts, definida por cada proveedor.","example":"Un proveedor puede reportar el strike con mayor exposición estimada de puts para su universo.","related":"Put · GEX · Call Wall"},{"term":"Max Pain","category":"Opciones y flujos","definition":"Cálculo del precio que minimiza el valor intrínseco agregado de opciones abiertas en una expiración bajo sus supuestos.","example":"Se calcula con el OI por strike y puede variar al cambiar la fecha de corte.","related":"Strike · Open Interest"},{"term":"Ejercicio y asignación","category":"Opciones y flujos","definition":"El titular ejerce el derecho y un vendedor asignado asume la obligación correspondiente bajo las reglas del contrato.","example":"SPY estándar puede tener asignación anticipada. SPX europeo se ejerce al vencimiento.","related":"Call · Put · Vencimiento"},{"term":"Moneyness (ITM / ATM / OTM)","category":"Opciones y flujos","definition":"Relación entre el strike y el precio de referencia que describe si una opción está dentro, cerca o fuera del dinero.","example":"Con precio 105, una call strike 100 está ITM antes de considerar la prima.","related":"Valor intrínseco · Strike"},{"term":"Drawdown","category":"Riesgo y evaluación","definition":"Caída desde un pico previo de la curva. Puede medirse en moneda, porcentaje o R según diseño.","example":"Desde un pico neto de 120 hasta 70, la caída es 50 unidades.","related":"Resultado acumulado · Riesgo diario"},{"term":"Win rate","category":"Riesgo y evaluación","definition":"Ganadoras divididas por operaciones cerradas válidas. Conviene declarar cómo se tratan los ceros.","example":"Seis ganadoras en diez operaciones cerradas dan 60%.","related":"Expectativa · Profit factor"},{"term":"Expectativa (Expectancy)","category":"Riesgo y evaluación","definition":"Resultado neto promedio de la muestra por operación, en una unidad común.","example":"Resultados de +2R, −1R y +1R dan ≈ +0,67R por operación.","related":"Win rate · Riesgo/beneficio"},{"term":"Profit factor","category":"Riesgo y evaluación","definition":"Suma de resultados ganadores dividida por el valor absoluto de los resultados perdedores.","example":"Con ganadoras de 120 y pérdidas de 80, el profit factor es 1,50.","related":"Expectativa · Win rate"},{"term":"Riesgo/beneficio (Risk/reward)","category":"Riesgo y evaluación","definition":"Comparación entre riesgo planificado y objetivo, con criterio claro sobre costos.","example":"Arriesgar 1R con objetivo de 2R expresa riesgo:beneficio de 1:2.","related":"Stop · Expectativa"},{"term":"Backtesting","category":"Riesgo y evaluación","definition":"Evaluación de reglas mediante datos históricos, controlando disponibilidad, costos y sesgos.","example":"Probar reglas fijas en treinta ejemplos con velas futuras ocultas.","related":"Overfitting · Forward testing"},{"term":"Forward testing","category":"Riesgo y evaluación","definition":"Prueba progresiva de reglas en observaciones nuevas, registradas antes del desenlace.","example":"Anotar cinco sesiones en simulador en las fechas en que ocurren.","related":"Backtesting · Adherencia"},{"term":"Sobreajuste (Overfitting)","category":"Riesgo y evaluación","definition":"Ajuste de reglas a particularidades de una muestra que pueden perderse fuera de ella.","example":"Probar decenas de stops y elegir el mejor en todo el histórico eleva este riesgo.","related":"Backtesting · Validación"},{"term":"Prop firm","category":"Riesgo y evaluación","definition":"Firma de trading propietario. Algunos proveedores ofrecen evaluaciones con condiciones para el operador.","example":"Una evaluación puede fijar un piso móvil y una pérdida diaria máxima con cálculos propios.","related":"Drawdown · Simulación"},{"term":"Unidad de riesgo (R)","category":"Riesgo y evaluación","definition":"Resultado dividido por el riesgo inicial planificado en la misma moneda.","example":"Riesgo de USD 20 y ganancia neta de USD 30 dan +1,50R.","related":"Stop · Riesgo/beneficio"}],"modules":[{"id":1,"title":"Fundamentos y lectura del mercado","level":"Básico","outcome":"Interpreta un contrato de futuros y convierte la lectura del gráfico en un escenario escrito.","deliverable":"Ficha de contrato, plan multi-timeframe, gráficos anotados y watchlist.","case":"Un futuro ficticio se mueve 3 puntos a favor. El tick es 0,25, vale USD 2 y usaste un contrato. Explica el P&L y presenta tu escenario antes de entrar.","rubric":"12 ticks y USD 24 brutos. Incluye contexto, referencia, gatillo, invalidación y resultado ajustado por costos si los conoces. Adjunta tu watchlist."},{"id":2,"title":"Contexto, Order Flow y estrategia","level":"Intermedio","outcome":"Construye una estrategia, documenta el riesgo y evalúa su comportamiento en simulador.","deliverable":"Ficha de estrategia, 30 ejemplos, métricas iniciales y registro de simulador.","case":"Tu presupuesto restante es 60. Cada contrato tiene riesgo por stop de 30 y costos estimados de 4. Explica qué tamaños enteros cabrían y cómo evaluarías el setup.","rubric":"El riesgo por contrato es 34. Uno equivale a 34 y dos, a 68. Se espera además una regla de entrada, invalidación y un backtest que incluya descartes."},{"id":3,"title":"Opciones, Gamma e integración","level":"Avanzado","outcome":"Integra opciones y flujos en un proceso trazable de simulación y revisión.","deliverable":"Diario, simulación de evaluación y Trading Playbook con evidencia.","case":"El OI sube y el mapa de un proveedor informa un Gamma Flip. Explica qué hechos puedes informar, qué supuestos faltan y cómo decides en simulador.","rubric":"Identifica contrato, corte de OI y modelo. Evita deducir posiciones netas del OI. Registra evidencia, condición de no operar, invalidación, riesgo y adherencia."}],"resources":[{"id":"futuros","source":"CME Group","title":"Introducción a futuros","url":"https://www.cmegroup.com/education/courses/introduction-to-futures","use":"Especificaciones, margen, vencimiento y operativa básica."},{"id":"pnl","source":"CME Group","title":"Cálculo del P&L de futuros","url":"https://www.cmegroup.com/education/courses/introduction-to-futures/calculating-futures-contract-profit-or-loss","use":"Conversión de precios a ticks y resultado monetario."},{"id":"riesgo","source":"CME Group","title":"Gestión del riesgo","url":"https://www.cmegroup.com/education/courses/trade-and-risk-management","use":"Material de estudio sobre exposición y control del riesgo."},{"id":"opciones","source":"CME Group","title":"Fundamentos de opciones sobre futuros","url":"https://www.cmegroup.com/education/whitepapers/fundamentals-of-options-on-futures","use":"Referencia para identificar subyacentes, ejercicio y asignación."},{"id":"cmeOpc","source":"CME Group","title":"Introducción a opciones","url":"https://www.cmegroup.com/education/courses/introduction-to-options","use":"Prima, strike, moneyness y fundamentos de contratos."},{"id":"todoOpc","source":"CME Group","title":"All About Options","url":"https://www.cmegroup.com/education/courses/curriculum-all-about-options","use":"Currículo complementario de opciones."},{"id":"oi","source":"CME Group","title":"Open Interest","url":"https://www.cmegroup.com/education/courses/introduction-to-futures/open-interest","use":"Lectura de contratos abiertos y su diferencia con volumen."},{"id":"oiDatos","source":"CME Group","title":"Reportes de volumen y Open Interest","url":"https://www.cmegroup.com/market-data/volume-open-interest.html","use":"Ejercicio de comparación de cortes publicados."},{"id":"cboe","source":"Cboe","title":"Comparación de SPX y SPY","url":"https://www.cboe.com/tradable-products/product-comparison","use":"Subyacente, ejercicio y liquidación por producto."},{"id":"occ","source":"OCC","title":"Características y riesgos de opciones estandarizadas","url":"https://www.theocc.com/company-information/documents-and-archives/options-disclosure-document","use":"Documento de referencia sobre opciones listadas."},{"id":"greeks","source":"Options Industry Council","title":"Understanding Options Greeks","url":"https://www.optionseducation.org/advancedconcepts/understanding-options-greeks","use":"Delta, Gamma, Theta y Vega con unidades."},{"id":"iv","source":"Options Industry Council","title":"IV diaria y regla de 16","url":"https://www.optionseducation.org/news/may-keytakeaways","use":"Conversión aproximada de IV anual a un horizonte diario."},{"id":"tv","source":"TradingView","title":"Centro de ayuda","url":"https://www.tradingview.com/support/","use":"Uso de gráficos, alertas y funciones de replay."},{"id":"ninja","source":"NinjaTrader","title":"Guía de NinjaTrader 8","url":"https://ninjatrader.com/support/helpGuides/nt8/","use":"Consulta de órdenes, historial y simulación."}]}</script>

  };
  const total = Object.entries(parts).reduce((sum,[key,pair]) => sum + state.weights[key]*percent(...pair)/100,0);
  return { parts, total:Math.round(total), watched:videos.filter(x => state.video[x.id]).length };

function simulationResult(s) {
  if (!s.mode) return "";
  const base = s.mode==="trail" ? Number(s.peak) : Number(s.initial);
  const floor = base-Number(s.draw);
  const daily = Math.max(0,Number(s.open)-Number(s.low));
  const closeLoss = Math.max(0,Number(s.open)-Number(s.close));
  const size = Number(s.observed)>Number(s.max);
  const brokeDaily = daily>=Number(s.daily);
  const brokeFloor = Number(s.low)<=floor;
  return '<div class="example"><strong>Simulación con tus cifras</strong><p>Pérdida intradía '+money(daily)+' · Pérdida al cierre '+money(closeLoss)+' · Piso calculado '+money(floor)+'.</p>'+
    '<p>'+ (brokeDaily || brokeFloor || size ? "Revisa los límites alcanzados o superados. " : "Los datos ingresados quedan dentro de los umbrales comparados. ")+
    (brokeDaily ? "Pérdida diaria. " : "")+(brokeFloor ? "Piso de drawdown. " : "")+(size ? "Tamaño máximo. " : "")+
    'Contrasta si la regla usa saldo, equity, cierre, intradía o una convención de igualdad distinta.</p></div>';
}

function journalOutcome(item) {
  if (item.exit === "") return null;
  const countToMoney=price=>price/Number(item.tickSize)*Number(item.tickValue)*Number(item.quantity);
  const direction=item.direction==="long" ? 1 : -1;
  const net=Math.round((countToMoney((Number(item.exit)-Number(item.entry))*direction)-Number(item.cost))*100)/100;
  const risk=countToMoney(Math.abs(Number(item.entry)-Number(item.stop)))+Number(item.cost);
  return { net, r:risk>0 ? net/risk : null };
}
function journalResults() {
  const f=filters.journal;
  if (f.from && f.to && f.from>f.to) return listEmpty("La fecha inicial debe ser anterior o igual a la final.");
  const rows=state.journal.map(item=>({item,result:journalOutcome(item)})).filter(({item,result})=>{
    const label=result===null ? "open" : result.net>0 ? "win" : result.net<0 ? "loss" : "even";
    return normalize(item.instrument+" "+item.contract).includes(normalize(f.instrument)) && normalize(item.setup).includes(normalize(f.setup)) &&
      (!f.from || item.date>=f.from) && (!f.to || item.date<=f.to) && (!f.result || f.result===label);
  }).sort((a,b)=>a.item.date.localeCompare(b.item.date)||a.item.created-b.item.created);
  const closed=rows.map(row=>row.result).filter(result=>result!==null);
  const wins=closed.filter(r=>r.net>0),losses=closed.filter(r=>r.net<0);
  const gains=wins.reduce((n,r)=>n+r.net,0), lossesSum=losses.reduce((n,r)=>n+r.net,0);
  let max=0,draw=0,running=0;
  for (const result of closed) {
    running+=result.net;
    max=Math.max(max,running);
    draw=Math.max(draw,max-running);
  }
  const stats=[
    ["Operaciones",rows.length],["Ganadoras",wins.length],["Perdedoras",losses.length],["Win rate",closed.length ? percent(wins.length,closed.length).toFixed(1)+"%" : "—"],
    ["Ganancia media",wins.length ? money(gains/wins.length) : "—"],["Pérdida media",losses.length ? money(lossesSum/losses.length) : "—"],
    ["Expectativa por operación",closed.length ? money(running/closed.length) : "—"],["Profit factor",losses.length ? money(gains/-lossesSum) : gains>0 ? "∞" : "—"],
    ["Resultado neto USD",closed.length ? money(running) : "—"],["Drawdown USD",closed.length ? money(draw) : "—"],
    ["Adherencia al plan",rows.length ? percent(rows.filter(row=>row.item.plan).length,rows.length).toFixed(1)+"%" : "—"]
  ];
  return '<div class="results-grid">'+stats.map(([label,val])=>metric(label,val)).join("")+'</div>'+
    (closed.length<30 ? '<p class="attention small-text block">Muestra insuficiente. '+closed.length+' de 30 cierres de referencia para este ejercicio.</p>' : '')+
    '<p class="fine block">El win rate incluye cierres en cero en su denominador. El drawdown usa la curva de P&L cerrado en orden de fecha y registro.</p>'+
    (rows.length ? '<div class="table-wrap block" tabindex="0" aria-label="Operaciones filtradas"><table><thead><tr>'+
    ["Fecha","Instrumento","Setup","Dirección","Neto USD","Resultado en R","Plan","Acciones"].map(x=>'<th scope="col">'+x+'</th>').join("")+'</tr></thead><tbody>'+
    [...rows].reverse().map(({item,result})=>'<tr><td>'+esc(item.date)+'</td><td><strong>'+esc(item.instrument)+'</strong><br><span class="fine">'+esc(item.contract)+'</span></td>'+
      '<td>'+esc(item.setup)+'</td><td>'+esc(item.direction)+'</td><td class="'+(result ? result.net>0?"positive":result.net<0?"negative":"" : "")+'">'+(result ? money(result.net) : "—")+'</td>'+
      '<td>'+(result?.r!=null ? money(result.r) : "—")+'</td><td>'+(item.plan?"Sí":"No")+'</td><td><div class="row">'+
      action("Editar","small ghost",'data-action="journal-edit" data-id="'+esc(item.id)+'"')+action("Eliminar","small danger ghost",'data-action="journal-delete" data-id="'+esc(item.id)+'"')+
      (validWebLink(item.chart) ? link("Gráfico",item.chart,"small ghost","external",true) : "")+'</div></td></tr>').join("")+
    '</tbody></table></div>' : listEmpty("Todavía no hay operaciones para mostrar."));
}
function validWebLink(value) {
  if (!value) return false;
  try { return ["https:","http:"].includes(new URL(value).protocol); } catch { return false; }
}
function journalValid(item) {
  const textLimits={instrument:65,contract:65,session:65,timeframe:65,setup:95,context:16000,reason:16000,learning:16000,chart:1600};
  const required=["instrument","contract","session","timeframe","setup"];
  if (!item || !/^[-\w]{1,80}$/.test(item.id) || !Number.isFinite(item.created) ||
    !isDate(item.date) || !["long","short"].includes(item.direction)) return false;
  if (!Object.entries(textLimits).every(([key,limit])=> isText(item[key],limit)) ||
    required.some(key=>!item[key].trim()) || (item.chart && !validWebLink(item.chart))) return false;
  if (!journalChecks.every(([,key])=>typeof item[key]==="boolean")) return false;
  if (!numericJournal.every(([,key])=> {
    if (["target","exit"].includes(key) && item[key]==="") return true;
    return isText(item[key],35) && item[key].trim() && Number.isFinite(Number(item[key])) && Math.abs(Number(item[key]))<=1e12;
  })) return false;
  if (!(Number(item.tickValue)>0 && Number(item.tickSize)>0 && Number(item.cost)>=0 &&
    Number.isInteger(Number(item.quantity)) && Number(item.quantity)>0)) return false;
  return item.direction==="long" ? Number(item.stop)<Number(item.entry) : Number(item.stop)>Number(item.entry);
}
function isText(value,max=16000) { return typeof value==="string" && value.length<=max; }
function isDate(value) {
  if (typeof value!=="string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const date=new Date(value+"T00:00:00Z");
  return !Number.isNaN(+date) && date.toISOString().slice(0,10)===value;
}
function validateState(input) {
  const fail=()=>{throw new Error("El JSON no coincide con el formato de respaldo de Trading Lab 90D.");};
  function object(value) { return !!value && typeof value==="object" && !Array.isArray(value); }
  function validMap(value,validate) {
    if (!object(value) || !Object.entries(value).every(([key,val])=>validate(key,val))) fail();
    return value;
  }
  const provided=Object.keys(freshState());
  if (!object(input) || provided.some(key=>!Object.hasOwn(input,key)) || input.version!==1 ||
    !["dark","light"].includes(input.theme) || (input.last!==null && (!Number.isInteger(input.last) || input.last<1 || input.last>24))) fail();
  const out=freshState();
  Object.assign(out,{theme:input.theme,last:input.last});
  const lessonKey=key=>/^(?:[1-9]|1\d|2[0-4])$/.test(key);
  const lessonNote=key=>/^[lr]/.test(key) && lessonKey(key.slice(1));
  const videoKey=key=>Object.hasOwn(byVideo,key);
  const playKey=key=>/^(?:[0-9]|1[0-7])$/.test(key);
  out.lesson=validMap(input.lesson,(key,val)=>lessonKey(key) && ["doing","done"].includes(val));
  out.video=validMap(input.video,(key,val)=>videoKey(key) && val===true);
  out.notes=validMap(input.notes,(key,val)=>isText(val) &&
    (lessonNote(key) || (key.startsWith("v") && videoKey(key.slice(1))) || (key.startsWith("a") && activityKeys.includes(key.slice(1)))));
  out.activity=validMap(input.activity,(key,val)=>activityKeys.includes(key) && Object.hasOwn(activityLabels,val));
  function validAnswers(key,answers,full=false) {
    const qs=questionsFor(key);
    return object(answers) && (!full || Object.keys(answers).length===qs.length) &&
      Object.entries(answers).every(([id,val])=>qs.some(q=>q.id===id && Number.isInteger(val) && val>=0 && val<q.options.length));
  }
  out.responses=validMap(input.responses,(key,val)=>quizKeys.includes(key) && validAnswers(key,val));
  out.grades=validMap(input.grades,(key,val)=>quizKeys.includes(key) && object(val) && validAnswers(key,val.answers,true)
    && val.score===questionsFor(key).filter(q=>val.answers[q.id]===q.correct).length && isDate(val.date));
  out.checks=validMap(input.checks,(key,val)=>{
    const max=(key.startsWith("l") && lessonKey(key.slice(1))) ? 4 :
      (key.startsWith("pre") && isDate(key.slice(3))) ? beforeMarket.length :
      (key.startsWith("post") && isDate(key.slice(4))) ? afterMarket.length : 0;
    return max>0 && Array.isArray(val) && val.length===new Set(val).size && val.every(n=>Number.isInteger(n) && n>=0 && n<max);
  });
  out.plan=validMap(input.plan,(key,val)=>/^[0-5]$/.test(key) && isText(val));
  out.project=validMap(input.project,(key,val)=>playKey(key) && object(val) &&
    (val.note===undefined || isText(val.note)) && (val.done===undefined || typeof val.done==="boolean"));
  out.simulation=validMap(input.simulation,(key,val)=>["daily","draw","mode","initial","peak","low","open","close","max","observed","rules"].includes(key)
    && isText(val,key==="rules"?16000:35));
  if (!Array.isArray(input.journal) || !input.journal.every(journalValid) ||
    new Set(input.journal.map(j=>j.id)).size!==input.journal.length) fail();
  if (!Array.isArray(input.days) || !input.days.every(isDate)) fail();
  out.journal=input.journal;
  out.days=[...new Set(input.days)].sort();
  const keys=Object.keys(defaultWeights);
  out.weights=validMap(input.weights,(key,n)=>keys.includes(key)&&Number.isInteger(n)&&n>=0&&n<=100);
  if (Object.keys(out.weights).length!==keys.length || Object.values(out.weights).reduce((sum,n)=>sum+n,0)!==100) fail();
  return out;
}
function color(varName) { return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }
function paintCharts() {
  document.querySelectorAll("canvas[data-chart]").forEach(canvas=>{
    const {width,height}=canvas.getBoundingClientRect();
    if (!width || !height) return;
    const ratio=Math.min(devicePixelRatio || 1,3);
    canvas.width=Math.round(width*ratio); canvas.height=Math.round(height*ratio);
    const ctx=canvas.getContext("2d");
    ctx.scale(ratio,ratio);
    if (canvas.dataset.chart==="hero") drawHero(ctx,width,height);
    else drawPayoff(ctx,width,height);
  });
}
function drawHero(ctx,width,height) {
  const closes=[28,33,30,35,32,38,47,44,51,48,39,43,36,40,51,58,54,62,68,62,72,67,74,70,82,89,84,92,88,97];
  const left=5, top=12, right=width-35, bottom=height-28, w=right-left, h=bottom-top;
  const y=value=>bottom-value/105*h;
  const x=i=>left+(i+.6)/closes.length*w;
  ctx.font="10px monospace";
  for(let i=0;i<6;i++) {
    const lineY=y(100-i*20);
    ctx.strokeStyle=color("--hero-grid");
    ctx.beginPath();ctx.moveTo(left,lineY);ctx.lineTo(right,lineY);ctx.stroke();
    ctx.fillStyle=color("--subtle");ctx.fillText(String(100-i*20),right+6,lineY+3);
  }
  for(let i=0;i<=8;i++) {
    const lineX=left+i*w/8;
    ctx.beginPath();ctx.moveTo(lineX,top);ctx.lineTo(lineX,bottom+12);ctx.stroke();
  }
  const isLight=document.documentElement.dataset.theme==="light";
  const average=closes.map((unused,i)=> {
    const span=closes.slice(Math.max(0,i-5),i+1);
    return span.reduce((a,b)=>a+b,0)/span.length;
  });
  ctx.strokeStyle=isLight?"#568780":"#548d84";
  ctx.lineWidth=1.3;
  ctx.beginPath();
  average.forEach((value,i)=>i===0?ctx.moveTo(x(i),y(value)):ctx.lineTo(x(i),y(value)));
  ctx.stroke();
  closes.forEach((close,i)=>{
    const open=(closes[i-1] ?? 24)+(i%3-1);
    const gap=2+(i*7)%5, stroke=close>=open?(isLight?"#287957":"#77d9ad"):(isLight?"#a1534b":"#be8275");
    const bar=Math.max(2,w/closes.length*.53);
    ctx.strokeStyle=stroke;ctx.fillStyle=stroke;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x(i),y(Math.max(close,open)+gap));ctx.lineTo(x(i),y(Math.min(close,open)-gap));ctx.stroke();
    ctx.fillRect(x(i)-bar/2,Math.min(y(close),y(open)),bar,Math.max(2,Math.abs(y(close)-y(open))));
    ctx.globalAlpha=.25;
    const volume=3+(i*7)%12;
    ctx.fillRect(x(i)-bar/2,bottom+13-volume,bar,volume);
    ctx.globalAlpha=1;
  });
}
function drawPayoff(ctx,width,height) {
  const left=37,right=width-17,top=20,bottom=height-22;
  const x=p=>left+(p-85)/30*(right-left);
  const y=r=>bottom-(r+8)/21*(bottom-top);
  ctx.lineWidth=1;
  ctx.strokeStyle=color("--edge");
  ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,bottom);ctx.lineTo(right,bottom);ctx.moveTo(left,y(0));ctx.lineTo(right,y(0));ctx.stroke();
  ctx.fillStyle=color("--muted");ctx.font="11px monospace";
  [85,95,100,105,115].forEach(p=>ctx.fillText(p,x(p)-8,bottom+15));
  [-4,0,5,10].forEach(r=>ctx.fillText(r,left-23,y(r)+4));
  [[color("--accent-text"),"Call",p=>Math.max(p-100,0)-4],[color("--orange"),"Put",p=>Math.max(100-p,0)-4]].forEach(([stroke,label,fn],i)=>{
    ctx.strokeStyle=stroke;ctx.fillStyle=stroke;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x(85),y(fn(85)));ctx.lineTo(x(100),y(fn(100)));ctx.lineTo(x(115),y(fn(115)));ctx.stroke();
    ctx.fillText(label,left+10+i*55,12);
  });
}

function calculateRisk(form) {
  const data=new FormData(form);
  const n=name=>Number(data.get(name));
  const capital=n("capital");
  const budget=data.get("mode")==="pct" ? capital*n("budget")/100 : n("budget");
  const per=(n("stop")+n("slip"))*n("tick")+n("fee");
  const risk=per*n("quantity");
  const daily=data.get("daily")===""?null:n("daily");
  const result=document.querySelector("#risk-result");
  if (![capital,budget,per,risk].every(Number.isFinite) || !(per>0)) {
    result.textContent="Revisa la magnitud de los valores ingresados."; return;
  }
  const available=Math.min(budget,daily ?? Infinity);
  const multiple=available/per;
  const max=Math.floor(multiple+Number.EPSILON*Math.max(1,multiple)*2);
  const capitalShare=percent(risk,capital);
  if (![capitalShare,max].every(Number.isFinite)) {
    result.textContent="Revisa la magnitud de los valores ingresados."; return;
  }
  const values=[["Riesgo por contrato",money(per)],["Riesgo del escenario",money(risk)],["% del capital",money(capitalShare)+"%"],
    ["Saldo del presupuesto",money(budget-risk)],["Capacidad matemática",new Intl.NumberFormat("es-PE").format(max)+(max===1?" contrato":" contratos")]];
  if (daily!==null) values.push(["Saldo del límite diario",money(daily-risk)]);
  result.innerHTML='<div class="eyebrow">Escenario · '+esc(String(data.get("instrument")).trim())+'</div><div class="results-grid block">'+
    values.map(([label,value])=>metric(label,value)).join("")+'</div><p class="'+(risk>available+Number.EPSILON*Math.max(1,available)*2?"attention":"muted")+' small-text block">'+
    (risk>available+Number.EPSILON*Math.max(1,available)*2?"El escenario supera el presupuesto o el límite diario introducido.":"El escenario queda dentro de los límites ingresados.")+
    ' La capacidad es la parte entera del presupuesto aplicable dividido entre el riesgo por contrato. Un fill puede desviarse del stop.</p>';
}

    checklistDate=input.value;document.querySelector("#daily-checks").innerHTML=dailyChecklists();
  }
  if (input.form?.id==="risk-form" && input.name==="mode") riskMode();
});
main.addEventListener("submit",event=>{
  event.preventDefault();
  const form=event.target;
  if (form.dataset.quiz) submitQuiz(form);
  else if (form.id==="weights-form") saveWeights(form);
  else if (form.id==="risk-form") calculateRisk(form);
  else if (form.id==="journal-form") saveJournal(form);
  else if (form.id==="simulation-form") saveSimulation(form);
});
main.addEventListener("reset",event=>{
  if (event.target.id==="risk-form") {
    document.querySelector("#risk-result").textContent="";
    setTimeout(riskMode,0);
  }
});
document.querySelector("#theme-toggle").addEventListener("click",()=>{
  state.theme=state.theme==="dark"?"light":"dark";save();applyTheme();
});
document.querySelector("#menu-toggle").addEventListener("click",()=>showMenu(!document.querySelector("#sidebar").classList.contains("open")));
document.querySelector("#menu-scrim").addEventListener("click",()=>{showMenu(false);document.querySelector("#menu-toggle").focus();});
document.addEventListener("keydown",event=>{
  if (event.key==="Escape" && document.querySelector("#sidebar").classList.contains("open")) {
    showMenu(false);document.querySelector("#menu-toggle").focus();
  }
});
document.querySelector(".skip").addEventListener("click",event=>{event.preventDefault();main.focus();});
window.addEventListener("hashchange",()=>go());
window.addEventListener("resize",paintCharts);
state=readState();
setStorageLabel();glyphs();applyTheme();go(true);
</script>
</body>
</html>
