<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Aula personal de futuros y opciones con clases, simulación y seguimiento de 90 días.">
<meta name="color-scheme" content="dark light">
<title>Trading Lab 90D</title>
<style>:root {
  color-scheme: dark;
  --back:#101517; --side:#111719; --panel:#171f22; --surface:#1b2528; --raised:#202d30;
  --edge:#2a383c; --text:#eef4f1; --muted:#a7b8ba; --subtle:#8fa3a7;
  --accent:#78e0b5; --accent-text:#92ebc8; --accent-bg:#214437; --on-accent:#0d231b;
  --orange:#f5bf83; --danger:#ffaca7; --outline:#83eccc; --hero:#142523; --hero-grid:#28433d;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --radius:15px; --side-width:242px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --back:#f0f5f3; --side:#f8fbfa; --panel:#fff; --surface:#f0f6f3; --raised:#e6f0eb;
  --edge:#ccdbd4; --text:#172b23; --muted:#4b625a; --subtle:#516b61;
  --accent:#086d51; --accent-text:#11694f; --accent-bg:#dcf3e8; --on-accent:#fff;
  --orange:#8d4b0a; --danger:#a02e31; --outline:#16795d; --hero:#e4f3ec; --hero-grid:#bfd9cd;
}
* { box-sizing:border-box; }
html { min-width:0; scrollbar-color:var(--edge) var(--back); }
body { margin:0; background:var(--back); color:var(--text); font:1rem/1.55 var(--sans); }
h1,h2,h3,h4,p,figure { margin:0; } h1,h2,h3,h4 { line-height:1.15; }
h1 { font-size:clamp(2rem,4vw,3.1rem); font-weight:710; letter-spacing:-.05em; }
h2 { font-size:1.45rem; font-weight:690; letter-spacing:-.032em; }
h3 { font-size:1.12rem; font-weight:690; letter-spacing:-.02em; } h4 { font-size:1rem; }
a { color:var(--accent-text); text-decoration:none; }
a:hover { text-decoration:underline; text-underline-offset:4px; }
button,input,select,textarea { font:inherit; }
button { cursor:pointer; } button:disabled { cursor:default; opacity:.55; }
:focus-visible { outline:2px solid var(--outline); outline-offset:4px; }
[hidden] { display:none !important; } main:focus { outline:none; }
.icon { width:19px; height:19px; flex:none; vertical-align:middle; }
.layout { display:grid; grid-template-columns:var(--side-width) minmax(0,1fr); min-height:100dvh; }
.sidebar { position:sticky; top:0; height:100dvh; overflow:auto; display:flex; flex-direction:column; padding:26px 17px 20px; background:var(--side); border-right:1px solid var(--edge); z-index:15; }
.brand { display:flex; gap:12px; align-items:center; padding:0 6px; color:var(--text); font-size:1.12rem; font-weight:730; letter-spacing:-.045em; white-space:nowrap; }
.brand:hover { text-decoration:none; } .brand b { color:var(--accent-text); } .brand small { display:block; color:var(--subtle); font:600 .625rem/1.25 var(--mono); letter-spacing:.11em; margin-top:4px; }
.brandmark { width:38px; height:38px; display:grid; place-items:center; background:var(--accent); color:var(--on-accent); border-radius:10px; } .brandmark .icon { width:25px; height:25px; }
#navigation { margin-top:30px; }
.nav-group { display:grid; gap:3px; margin:0 0 20px; }
.nav-label { color:var(--subtle); margin:0 10px 7px; font:650 .685rem/1.2 var(--mono); letter-spacing:.09em; text-transform:uppercase; }
.nav-link { color:var(--muted); display:flex; align-items:center; gap:10px; padding:9px 10px; min-height:41px; font-size:.875rem; line-height:1.15; border-radius:8px; border:1px solid transparent; }
.nav-link:hover { background:var(--surface); color:var(--text); text-decoration:none; }
.nav-link[aria-current="page"] { color:var(--accent-text); font-weight:650; background:var(--accent-bg); border-color:color-mix(in srgb,var(--accent),transparent 75%); }
.side-footer { display:flex; gap:10px; align-items:center; margin-top:auto; padding:14px 7px 0; border-top:1px solid var(--edge); color:var(--muted); line-height:1.35; }
.side-footer strong { display:block; color:var(--text); font-size:.82rem; } .side-footer small { font-size:.745rem; }
.side-foot-icon { color:var(--accent-text); background:var(--surface); border-radius:8px; display:grid; place-items:center; width:34px; height:34px; }
.workspace { min-width:0; display:flex; flex-direction:column; }
.topbar { height:70px; border-bottom:1px solid var(--edge); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 clamp(19px,3.1vw,48px); }
.top-left,.breadcrumbs,.top-actions { display:flex; gap:12px; align-items:center; min-width:0; }
.breadcrumbs { color:var(--subtle); font-size:.875rem; gap:8px; } .breadcrumbs .icon { width:13px; height:13px; } .breadcrumbs strong { color:var(--text); font-weight:630; }
.local-indicator { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:.8rem; white-space:nowrap; }
.local-indicator i { width:7px; height:7px; background:var(--accent); border-radius:50%; } .local-indicator.problem i { background:var(--orange); }
.icon-button { background:var(--panel); color:var(--text); border:1px solid var(--edge); border-radius:9px; width:37px; height:37px; padding:0; display:inline-grid; place-items:center; }
.icon-button:hover { background:var(--raised); } .mobile-menu { display:none; }
main { width:100%; max-width:1520px; margin:0 auto; padding:34px clamp(19px,3.1vw,48px) 42px; flex:1; }
.footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; color:var(--subtle); font-size:.78rem; padding:18px clamp(19px,3.1vw,48px); border-top:1px solid var(--edge); }
.skip { position:fixed; left:12px; top:10px; z-index:50; padding:10px; background:var(--panel); transform:translateY(-160%); } .skip:focus { transform:none; }
.eyebrow { font:650 .75rem/1.35 var(--mono); letter-spacing:.09em; text-transform:uppercase; color:var(--accent-text); display:flex; gap:8px; align-items:center; }
.eyebrow .icon { width:15px; height:15px; }
.heading { margin-bottom:26px; display:flex; gap:20px; justify-content:space-between; align-items:flex-end; }
.heading .eyebrow { margin-bottom:9px; } .heading p { max-width:66ch; color:var(--muted); margin-top:10px; }
.hero { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); position:relative; overflow:hidden; background:var(--hero); border:1px solid var(--hero-grid); border-radius:19px; }
.hero-body { z-index:1; padding:clamp(26px,3.2vw,47px); padding-right:0; align-self:center; }
.hero h1 { margin:12px 0 14px; font-size:clamp(2.35rem,4.28vw,4.65rem); line-height:1.02; white-space:nowrap; }
.hero h1 span { color:var(--accent-text); }
.hero p { color:var(--muted); font-size:1.025rem; line-height:1.62; max-width:45ch; }
.hero-actions { display:flex; align-items:center; flex-wrap:wrap; margin-top:23px; gap:12px; }
.hero-chart { min-height:285px; position:relative; display:grid; align-items:center; padding:26px 22px 18px 4px; }
.hero-chart canvas { display:block; width:100%; height:100%; min-height:222px; }
.hero-chart figcaption { position:absolute; right:20px; bottom:14px; color:var(--subtle); font:600 .69rem var(--mono); }
.button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:8px 13px; border:1px solid var(--edge); border-radius:8px; color:var(--text); background:var(--surface); font-weight:650; font-size:.885rem; text-align:center; line-height:1.2; white-space:normal; }
.button:hover { background:var(--raised); text-decoration:none; }
.button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.button.primary:hover { filter:brightness(1.08); } .button.ghost { background:transparent; } .button.ghost:hover { background:var(--surface); }
.button.danger { color:var(--danger); } .button.small { min-height:34px; padding:6px 10px; font-size:.82rem; } .button .icon { width:16px; height:16px; }
.home-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:13px; margin:18px 0 29px; }
.stat { min-width:0; display:grid; align-content:start; min-height:97px; gap:8px; padding:14px 15px; border:1px solid var(--edge); border-radius:12px; background:var(--panel); }
.stat-label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.82rem; line-height:1.25; }
.stat-label .icon { color:var(--accent-text); width:16px; height:16px; }
.stat-value { font:650 clamp(1.15rem,2vw,1.57rem)/1.15 var(--mono); letter-spacing:-.05em; overflow-wrap:anywhere; }
.stat-value small { color:var(--subtle); font-size:.76rem; font-weight:500; letter-spacing:normal; }
.section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; }
.section-head a { font-size:.86rem; white-space:nowrap; }
.home-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(0,1fr); gap:18px; }
.home-lower { margin-top:25px; }
.panel { background:var(--panel); border:1px solid var(--edge); border-radius:var(--radius); padding:20px; min-width:0; }
.panel h2 + p,.panel h3 + p,.panel h4 + p { margin-top:8px; } .panel p + p { margin-top:9px; }
.panel + .panel { margin-top:14px; }
.nested-grid > .panel,.home-grid > .panel,.cards > .panel { margin-top:0; }
.next-card { display:grid; grid-template-columns:76px minmax(0,1fr); gap:17px; align-items:start; height:100%; }
.next-art { width:76px; height:76px; border-radius:12px; border:1px solid color-mix(in srgb,var(--accent),transparent 69%); background:var(--accent-bg); color:var(--accent-text); display:grid; place-items:center; }
.next-art .icon { width:29px; height:29px; } .next-card h3 { margin:9px 0 6px; }
.next-card p { font-size:.93rem; } .next-card .button { margin-top:14px; }
.inline-stat { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; font-size:.9rem; }
.inline-stat strong { font-family:var(--mono); color:var(--accent-text); }
.progress { height:7px; border-radius:20px; overflow:hidden; background:var(--raised); margin:8px 0 14px; }
.progress > span { display:block; height:100%; background:var(--accent); border-radius:inherit; }
.track-row { display:grid; grid-template-columns:38px minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--edge); color:var(--text); }
.track-row:last-child { border-bottom:0; }
.track-row:hover { text-decoration:none; color:var(--accent-text); }
.track-no { width:32px; height:32px; display:grid; place-items:center; color:var(--accent-text); background:var(--accent-bg); border-radius:7px; font:600 .76rem var(--mono); }
.track-row b { font-size:.92rem; display:block; } .track-row small { color:var(--subtle); font-size:.78rem; display:block; }
.quick-link { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px; padding:10px 0; border-bottom:1px solid var(--edge); }
.quick-link:last-child { border:0; padding-bottom:1px; }
.label { display:inline-flex; align-items:center; gap:5px; max-width:100%; border:1px solid var(--edge); border-radius:6px; padding:3px 7px; color:var(--muted); font-size:.756rem; line-height:1.3; width:fit-content; }
.label.mint { color:var(--accent-text); background:var(--accent-bg); border-color:transparent; }
.label.amber { color:var(--orange); }
.muted { color:var(--muted); } .small-text { font-size:.85rem; } .fine { font-size:.78rem; color:var(--subtle); }
.row { display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
.split { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.stack { display:grid; gap:12px; } .stack > .panel { margin-top:0; }
.block { margin-top:20px; }
.nested-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
.cards .panel { display:grid; align-content:start; gap:9px; }
.cards .panel h3 + p { margin:0; }
.filters { display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; margin-bottom:15px; }
.filters label { flex:1 1 115px; } .filters label.search-field { flex:2 1 215px; }
.field { display:grid; align-content:start; gap:5px; min-width:0; color:var(--muted); font-weight:600; font-size:.875rem; }
.field input,.field select,.field textarea { width:100%; min-width:0; font-weight:450; }
input:not([type=checkbox]):not([type=radio]),select,textarea { background:var(--back); color:var(--text); min-height:41px; border:1px solid var(--edge); border-radius:8px; padding:8px 10px; }
input::placeholder,textarea::placeholder { color:var(--subtle); opacity:1; }
textarea { resize:vertical; min-height:100px; } select { cursor:pointer; }
input[type=checkbox],input[type=radio] { accent-color:var(--accent); width:17px; height:17px; flex:none; margin:3px 1px 0 0; }
.check { display:flex; gap:9px; align-items:flex-start; cursor:pointer; padding:6px 0; }
.checklist { display:grid; gap:2px; margin:10px 0; }
.list-item { display:grid; grid-template-columns:40px minmax(0,1fr) auto; align-items:center; gap:13px; padding:13px 0; border-bottom:1px solid var(--edge); }
.list-item:last-child { border-bottom:0; padding-bottom:0; }
.list-item:first-child { padding-top:0; }
.item-icon { width:40px; height:40px; border-radius:9px; background:var(--surface); display:grid; place-items:center; color:var(--accent-text); font:600 .8rem var(--mono); }
.item-item-actions { display:flex; gap:7px; justify-content:flex-end; flex-wrap:wrap; }
.item-title { color:var(--text); font-weight:670; }
.video-grid { display:grid; grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr); gap:16px; align-items:start; }
.video-grid > .panel { margin-top:0; }
.video-screen { aspect-ratio:16 / 9; display:grid; place-items:center; position:relative; border:1px solid var(--edge); background:#111a1c; color:#d9eee5; border-radius:11px; overflow:hidden; }
.video-screen .big-play { width:64px; height:64px; border-radius:50%; background:#264338; color:#a3edcf; border:1px solid #456e60; display:grid; place-items:center; }
.big-play:hover { background:#315749; } .big-play .icon { width:26px; height:26px; }
.video-screen iframe { width:100%; height:100%; border:0; position:absolute; inset:0; }
.video-screen .screen-copy { display:grid; place-items:center; gap:10px; }
.video-screen .screen-copy small { font-size:.78rem; }
.video-list { max-height:65vh; overflow:auto; padding:0 5px 3px 0; scrollbar-gutter:stable; }
.video-list .list-item { grid-template-columns:32px minmax(0,1fr); gap:8px; }
.video-list .item-icon { width:32px; height:32px; } .video-list .item-title { display:block; text-align:left; padding:0; color:var(--text); background:none; border:0; }
.video-list .item-title:hover,.video-list .item-title[aria-current] { color:var(--accent-text); }
.tabs { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:15px; }
.tabs .button[aria-current] { background:var(--accent-bg); color:var(--accent-text); border-color:var(--accent); }
.lesson-read { line-height:1.66; }
.lesson-read > * + * { margin-top:15px; }
.lesson-read ol,.lesson-read ul { margin-bottom:0; padding-left:1.35em; } .lesson-read li + li { margin-top:7px; }
.example { padding:14px 16px; border-left:3px solid var(--accent); background:var(--surface); border-radius:0 8px 8px 0; }
.example strong { color:var(--accent-text); display:block; font-size:.8rem; margin-bottom:4px; }
.diagram { display:flex; align-items:stretch; flex-wrap:wrap; gap:8px; margin-top:11px; }
.diagram span { padding:8px 10px; border:1px solid var(--edge); border-radius:7px; background:var(--surface); color:var(--text); font-size:.84rem; }
.edu-chart { width:100%; height:185px; margin-top:10px; display:block; }
.details { border:1px solid var(--edge); border-radius:10px; padding:11px 13px; background:var(--surface); }
.details summary { cursor:pointer; font-weight:650; } .details[open] summary { margin-bottom:10px; }
.figure-step { display:grid; gap:6px; margin:11px 0 0; }
.form-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; }
.form-grid .wide { grid-column:1/-1; }
.form-grid.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
.quiz { margin-top:13px; }
.quiz fieldset { border:1px solid var(--edge); border-radius:9px; margin:0 0 14px; padding:10px 13px; min-width:0; }
.quiz legend { padding:0 5px; font-weight:650; } .quiz fieldset .fine { margin-bottom:4px; }
.quiz .check { border-radius:6px; padding:5px; }
.quiz .right { background:var(--accent-bg); } .quiz .wrong { color:var(--danger); }
.feedback { padding:9px; background:var(--surface); border-radius:7px; margin-top:7px; }
.attention { color:var(--orange); } .positive { color:var(--accent-text); } .negative { color:var(--danger); }
.table-wrap { overflow:auto; }
table { width:100%; border-collapse:collapse; text-align:left; }
th,td { border-bottom:1px solid var(--edge); padding:9px 10px; }
th { color:var(--muted); font-size:.8rem; }
td { color:var(--text); font-size:.86rem; white-space:nowrap; }
.results-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.results-grid .stat { min-height:70px; padding:10px; }
.week-items { padding-left:20px; color:var(--muted); margin:8px 0 12px; } .week-items li + li { margin-top:5px; } .week-items strong { color:var(--text); }
.empty { color:var(--muted); padding:15px 0; }
.toast { position:fixed; z-index:30; bottom:18px; right:18px; max-width:min(450px,calc(100vw - 36px)); border:1px solid var(--edge); background:var(--raised); box-shadow:0 5px 20px #0004; color:var(--text); border-radius:10px; padding:12px 15px; }
.menu-scrim { display:none; }
@media (max-width:1200px) { .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:1020px) { :root { --side-width:207px; } .sidebar { padding-inline:12px; } .hero h1 { font-size:clamp(2rem,4.6vw,3.3rem); } .hero-chart { min-height:235px; } .hero-chart canvas { min-height:185px; } .hero-body { padding-block:28px; } .home-stats { gap:9px; } .stat { padding:12px; } .results-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:790px) {
  .layout { grid-template-columns:minmax(0,1fr); }
  .sidebar { position:fixed; width:min(265px,83vw); left:0; top:0; transform:translateX(-103%); transition:transform .2s ease; visibility:hidden; }
  .sidebar.open { transform:none; visibility:visible; }
  .mobile-menu { display:inline-grid; }
  .menu-scrim:not([hidden]) { display:block; position:fixed; z-index:14; inset:0; background:#0008; border:0; }
  .topbar { height:60px; }
  main { padding-top:24px; }
}
@media (max-width:610px) {
  .hero { grid-template-columns:minmax(0,1fr); }
  .hero-body { padding:23px 20px 0; } .hero h1 { font-size:clamp(2.22rem,9.5vw,3.25rem); white-space:normal; }
  .hero-chart { padding:5px 10px 14px; min-height:138px; height:150px; }
  .hero-chart canvas { min-height:0; } .hero-chart figcaption { right:13px; bottom:9px; }
  .home-stats,.results-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .home-grid,.nested-grid,.video-grid,.cards { grid-template-columns:minmax(0,1fr); }
  .heading { display:block; } .heading > .button { margin-top:9px; }
  .next-card { grid-template-columns:52px minmax(0,1fr); gap:11px; }
  .next-art { width:52px; height:52px; } .next-art .icon { width:24px; height:24px; }
  .panel { padding:15px; } .video-list { max-height:430px; }
  .list-item { grid-template-columns:34px minmax(0,1fr); gap:8px; }
  .item-icon { width:34px; height:34px; }
  .item-item-actions { grid-column:2; justify-content:flex-start; }
  .form-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:390px) { .breadcrumbs > span,.local-indicator { display:none; } .form-grid,.form-grid.two { grid-template-columns:minmax(0,1fr); } .stat-label { font-size:.76rem; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; animation-duration:0s !important; transition-duration:0s !important; } }
#confirmation { max-width:min(470px,calc(100vw - 32px)); padding:22px; border-radius:14px; border:1px solid var(--edge); background:var(--panel); color:var(--text); }
#confirmation::backdrop { background:#080d0dbb; }
#confirmation h2 { margin-bottom:9px; }
.home-grid > .stack { grid-template-rows:auto 1fr; gap:0; }
.home-grid .next-card { height:auto; }
</style>
</head>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#inicio" aria-label="Trading Lab 90D · Inicio">
      <span class="brandmark" data-icon="brand" aria-hidden="true"></span>
      <span>Trading Lab <b>90D</b><small>FUTUROS Y OPCIONES</small></span>
    </a>
    <nav id="navigation" aria-label="Secciones del aula"></nav>
    <div class="side-footer"><span class="side-foot-icon" data-icon="shield" aria-hidden="true"></span><span><strong>Entorno de estudio</strong><small>Práctica en simulador</small></span></div>

  <div class="workspace">

arte e invalidación.","chart":"Aplica el criterio en veinte cortes históricos.","application":"Ensaya una configuración en replay y archiva también un descarte.","reflection":"¿Podría otra persona aplicar tus reglas con el mismo gráfico?","deliverable":"Ficha de estrategia y matriz de veinte casos.","quiz":{"id":"w6","prompt":"¿Qué aporta guardar los descartes de tu setup?","options":["Evita declarar perdedoras","Elimina todo sesgo","Permite auditar cuándo y por qué se excluyeron casos"],"correct":2,"explanation":"Los descartes son parte de la aplicación de la regla.","reference":"Semana 6","kind":"Criterio"}},{"id":7,"title":"Gestión del riesgo y backtesting","month":2,"lessons":[12,13],"reading":"Lee la fuente oficial sobre ticks, P&L y riesgo.","chart":"Marca distancia de stop y salida en escenarios históricos.","application":"Resuelve cinco cálculos de riesgo y construye una muestra de treinta casos.","reflection":"¿Qué costo o sesgo cambia más tu conclusión?","deliverable":"Tabla de riesgo, backtest inicial y límite declarado.","quiz":{"id":"w7","prompt":"¿Qué pasa con un cálculo de riesgo cuando elevas el slippage estimado?","options":["Aumenta el riesgo total estimado","Baja de forma automática","El tamaño del tick cambia"],"correct":0,"explanation":"El deslizamiento suma a los costos del escenario modelado.","reference":"Semana 7","kind":"Criterio"}},{"id":8,"title":"Simulación y evaluación intermedia","month":2,"lessons":[14,15],"reading":"Lee los requisitos de la simulación y repasa métricas netas.","chart":"Marca en una captura dónde se desvió una ejecución.","application":"Completa cinco sesiones y revisa el checklist postmercado.","reflection":"¿Qué error repetido puedes medir la próxima semana?","deliverable":"Diario, revisión de adherencia y evaluación del mes 2.","quiz":{"id":"w8","prompt":"¿Qué mejor describe un día sin setup válido?","options":["Una falla de ejecución","Una decisión de espera que puede ajustarse al plan","Un trade de resultado cero"],"correct":1,"explanation":"Una sesión sin trade se documenta sin añadir una operación ficticia.","reference":"Semana 8","kind":"Criterio"}},{"id":9,"title":"Fundamentos de opciones","month":3,"lessons":[16,17],"reading":"Compara especificaciones de SPX, SPY y una opción sobre futuros.","chart":"Dibuja perfiles de expiración y marca zona de ganancia y pérdida.","application":"Cambia por separado precio, tiempo e IV en tres escenarios.","reflection":"¿Qué regla contractual cambiaría tu interpretación?","deliverable":"Tabla contractual, perfiles y matriz de Greeks.","quiz":{"id":"w9","prompt":"¿Qué debes verificar antes de asumir qué recibes tras el ejercicio?","options":["El máximo del día","El IV promedio","El subyacente, estilo y liquidación de la serie"],"correct":2,"explanation":"Cada serie puede tener entregable y reglas propios.","reference":"Semana 9","kind":"Criterio"}},{"id":10,"title":"Open Interest y posicionamiento","month":3,"lessons":[18,19],"reading":"Revisa Open Interest y la documentación del proveedor de GEX.","chart":"Superpone en un caso de estudio fecha, vencimiento y strikes relevantes.","application":"Compara dos cortes y documenta cómo cambió un nivel estimado.","reflection":"¿Qué posición neta queda sin identificar con datos agregados?","deliverable":"Mapas de OI y GEX con hipótesis y supuestos.","quiz":{"id":"w10","prompt":"¿Por qué pueden variar Call Wall y Gamma Flip entre fuentes?","options":["Pueden usar supuestos y ventanas diferentes","Son datos idénticos en cualquier modelo","Solo depende del color de los gráficos"],"correct":0,"explanation":"Las convenciones de posición y agregación afectan la estimación.","reference":"Semana 10","kind":"Criterio"}},{"id":11,"title":"Integración de flujos","month":3,"lessons":[20,21],"reading":"Distingue datos de opciones de datos de órdenes del subyacente.","chart":"Alinea observaciones de un caso histórico por hora y fuente.","application":"Prepara un informe premercado y registra si esperarías o ejecutarías en simulador.","reflection":"¿Qué dato habría cambiado la decisión?","deliverable":"Informe con hechos, hipótesis y condición de no operar.","quiz":{"id":"w11","prompt":"Si hay un lote grande pero no conoces las otras piernas, ¿qué registras?","options":["Que abre una apuesta alcista con certeza","La transacción observada y las hipótesis alternativas","Una señal válida por el tamaño"],"correct":1,"explanation":"El lote es observable. La intención necesita contexto adicional.","reference":"Semana 11","kind":"Criterio"}},{"id":12,"title":"Simulación y proyecto final","month":3,"lessons":[22,23,24],"reading":"Documenta las reglas de la evaluación simulada y revisa la rúbrica.","chart":"Adjunta un caso favorable y otro adverso con datos visibles al decidir.","application":"Haz replay, completa la evaluación simulada y termina el playbook.","reflection":"¿Qué regla revisarás tras el día 90 y con qué evidencia?","deliverable":"Trading Playbook, bitácora final y autoevaluación del mes 3.","quiz":{"id":"w12","prompt":"¿Qué combinación respalda mejor tu evaluación final?","options":["Ganancia de una única sesión","Una lista amplia de indicadores","Reglas claras, resultados netos y evidencia de adherencia"],"correct":2,"explanation":"El proyecto evalúa proceso, documentación y riesgo.","reference":"Semana 12","kind":"Criterio"}}],"lessons":[{"id":1,"week":1,"month":1,"title":"Introducción a mercados y contratos de futuros","level":"Básico","videos":["B7"],"videoKind":"apoyo","goal":"Distinguir un futuro del spot y de una opción y calcular el P&L de un contrato.","summary":"Un futuro es un contrato estandarizado referenciado a un subyacente. El nocional mide la exposición y el margen es la garantía exigida para mantener la posición. El tamaño del tick y su valor monetario explican cuánto cambia el P&L.","previous":"Basta saber calcular porcentajes.","concepts":["Futuros","Tick","Valor del tick","Nocional","Margen"],"steps":["Compara cómo se obtiene exposición en spot, futuros y opciones.","Busca símbolo, multiplicador, vencimiento, tick, liquidación y horario en la ficha oficial.","Convierte el movimiento a ticks y multiplica por el valor del tick y el número de contratos."],"example":"Con valores ficticios, un movimiento de 2 puntos con tick de 0,25 equivale a 8 ticks. Si cada tick vale USD 2 por contrato, el cambio bruto es USD 16 por contrato.","tip":"Anota la fecha de consulta y distingue el margen del mercado del que exige tu intermediario.","error":"Confundir el margen con una pérdida máxima o aplicar el multiplicador del contrato estándar a un micro.","activity":"Investiga un contrato estándar y su versión micro. Calcula tres P&L brutos, uno favorable, uno adverso y uno sin cambio.","deliverable":"Ficha del contrato, fuente y tres cálculos con unidades.","sources":["futuros","pnl"],"quiz":[{"id":"1-1","prompt":"Si el tick vale USD 2 y el precio avanza 8 ticks a tu favor con dos contratos, ¿cuál es el P&L bruto?","options":["USD 16","USD 32","USD 64"],"correct":1,"explanation":"8 ticks × USD 2 × 2 contratos = USD 32, antes de costos.","reference":"Clase 1","kind":"Aplicación"},{"id":"1-2","prompt":"¿Qué dato representa la garantía exigida para mantener una posición?","options":["Nocional","Precio de liquidación","Margen de mantenimiento"],"correct":2,"explanation":"El margen de mantenimiento es el mínimo exigido para sostener la posición, según las reglas aplicables.","reference":"Clase 1","kind":"Comprensión"}]},{"id":2,"week":1,"month":1,"title":"Plataforma, órdenes y ejecución","level":"Básico","videos":["B7"],"videoKind":"principal","goal":"Practicar tipos de órdenes y verificar qué ocurre desde el envío hasta la ejecución.","summary":"Una orden de mercado prioriza ejecución, una limitada fija un precio máximo de compra o mínimo de venta, y una stop se activa con un precio gatillo. Una stop-limit puede activarse sin ejecutarse. El slippage compara el precio de referencia con el de ejecución.","previous":"Ficha y valor del tick de la clase 1.","concepts":["Bid","Ask","Spread","Órdenes","Slippage","Rollover"],"steps":["Abre un simulador y verifica contrato, cuenta y sesión.","Envía market, limit, stop y stop-limit. Prueba una bracket u OCO si está disponible.","Compara estados, precios, costos y cancelaciones en el historial."],"example":"Un bid de 100 y un ask de 101 dan un spread de 1. Una compra de mercado podría ejecutarse a 101 o a un precio peor si cambia la liquidez.","tip":"Repite una prueba en replay y registra la diferencia entre el precio esperado y el recibido.","error":"Confundir una orden aceptada con una posición abierta o tratar el gatillo de una stop como precio garantizado.","activity":"Practica cinco órdenes. Cancela las que sigan pendientes y revisa qué se ejecutó.","deliverable":"Tabla de cinco pruebas con tipo, estado, precio y observación.","sources":["ninja"],"quiz":[{"id":"2-1","prompt":"¿Qué puede ocurrir con una stop-limit activada cuando el precio salta su límite?","options":["Puede quedar sin ejecutar","Siempre se ejecuta en el gatillo","Se vuelve market por defecto"],"correct":0,"explanation":"Tras activarse sigue sujeta al precio límite.","reference":"Clase 2","kind":"Aplicación"},{"id":"2-2","prompt":"La plataforma indica «aceptada». ¿Qué compruebas para saber si ya hay posición?","options":["La escala del gráfico","Los fills y la posición neta","El nombre del símbolo solamente"],"correct":1,"explanation":"Una orden aceptada puede seguir pendiente. El fill confirma la ejecución.","reference":"Clase 2","kind":"Criterio"}]},{"id":3,"week":2,"month":1,"title":"Teoría de los trimestres y ciclos","level":"Básico","videos":["B1","B2"],"videoKind":"principal","goal":"Plantear hipótesis de ciclo en temporalidades distintas y definir cuándo dejan de ser útiles.","summary":"El modelo de trimestres organiza la observación de fases. Puedes comparar acumulación, una ruptura fallida atribuida por el modelo a manipulación, distribución y posible continuación o reversión. Las fases son hipótesis y su duración puede variar.","previous":"Lectura básica de identificadores, precios y fechas.","concepts":["Ciclo","Temporalidad","Rango","Hipótesis"],"steps":["Marca periodos anual, trimestral, mensual, semanal y diario en un gráfico histórico.","Señala rangos, rupturas y reingresos con datos visibles antes del cierre.","Formula una lectura alternativa y define la observación que invalidaría cada explicación."],"example":"En un caso ficticio, el precio sale del rango semanal por arriba y cierra dentro. Puedes anotar ruptura fallida y esperar evidencia adicional antes de clasificar una fase.","tip":"Usa velas cerradas y conserva el gráfico original para revisar si tu clasificación cambió con el resultado.","error":"Etiquetar fases a posteriori y tratar su nombre como señal de entrada.","activity":"Marca ciclos de tres temporalidades y registra un ejemplo dudoso que no puedas clasificar.","deliverable":"Gráfico anotado con hipótesis, alternativa e invalidación.","sources":["tv"],"quiz":[{"id":"3-1","prompt":"Una ruptura semanal cierra otra vez dentro del rango. ¿Qué puedes registrar de inmediato?","options":["Distribución confirmada","Una ruptura fallida bajo un criterio de cierre","Entrada obligatoria en corto"],"correct":1,"explanation":"El cierre dentro del rango es observable. La etiqueta de fase requiere más evidencia.","reference":"Clase 3","kind":"Aplicación"},{"id":"3-2","prompt":"¿Qué comparación conserva la lógica multi-timeframe?","options":["Elegir el marco después del resultado","Igualar la duración de todas las fases","Relacionar la fase semanal con un escenario diario definido previamente"],"correct":2,"explanation":"La relación entre marcos sirve para formular hipótesis previas.","reference":"Clase 3","kind":"Criterio"}]},{"id":4,"week":2,"month":1,"title":"Lectura multi-timeframe y planificación","level":"Básico","videos":["B3"],"videoKind":"principal","goal":"Traducir la lectura de temporalidades en un plan premercado editable.","summary":"Parte del panorama mayor, identifica estructura y referencias y redacta escenarios antes de mirar el marco de ejecución. El orden reduce el riesgo de usar una vela pequeña para justificar una decisión ya tomada.","previous":"Hipótesis de ciclos y estructura de la clase 3.","concepts":["Big picture","Estructura","Escenario","Invalidación"],"steps":["Describe el panorama mayor y las referencias de estructura.","Escribe la hipótesis de posicionamiento y bosqueja escenarios para la siguiente sesión.","Define activación, invalidación y riesgo. Revisa tu preparación mental y operativa."],"example":"Rango diario con resistencia en 105. En marco menor, una ruptura solo activa el escenario escrito si cumple el criterio de aceptación definido antes de observarla.","tip":"Completa la plantilla antes del replay y guarda una copia de tu escenario inicial.","error":"Cambiar el marco temporal hasta encontrar confirmación o añadir condiciones después de ver el desenlace.","activity":"Completa los seis pasos de la plantilla con un escenario alcista, uno bajista y uno neutral.","deliverable":"Plan con escenario, condición de no operación e invalidación.","sources":["tv"],"quiz":[{"id":"4-1","prompt":"¿Cuándo conviene escribir el criterio de invalidación para un replay?","options":["Antes de revelar la temporalidad de ejecución","Después de ver las velas siguientes","Solo cuando aparece una ganancia"],"correct":0,"explanation":"Fijarlo antes preserva los datos disponibles al decidir.","reference":"Clase 4","kind":"Aplicación"},{"id":"4-2","prompt":"¿Qué paso conecta el escenario con una decisión verificable?","options":["Cambiar de mercado al azar","Definir activación, invalidación y riesgo","Duplicar la watchlist"],"correct":1,"explanation":"Esos elementos permiten comprobar si la decisión respeta el plan.","reference":"Clase 4","kind":"Criterio"}]},{"id":5,"week":3,"month":1,"title":"Herramientas de lectura y referencias","level":"Básico","videos":["B4","B5","B6"],"videoKind":"principal","goal":"Marcar referencias en gráficos y distinguir qué mide cada herramienta.","summary":"Las velas resumen apertura, máximo, mínimo y cierre de un intervalo. Las zonas recogen un área de interés. Un mapa de OI agrega datos según el proveedor. Observa primero, luego escribe la hipótesis y la evidencia pendiente.","previous":"Velas y escenarios de las clases 3 y 4.","concepts":["OHLC","Máximos y mínimos","Zonas","Open Interest Heatmap"],"steps":["Selecciona contrato, fecha, escala y zona horaria.","Marca máximo y mínimo previos, zona de congestión y dos referencias adicionales.","Describe qué dato aporta cada herramienta y a qué mercado y fecha corresponde."],"example":"Tres máximos cercanos a 100 forman una zona ilustrativa. Un mapa de opciones del día anterior es otra fuente y exige comprobar subyacente, expiración y hora.","tip":"Etiqueta la fuente y unidad de cada referencia anotada.","error":"Confundir un dato agregado con órdenes disponibles hoy o trasladar parámetros de Frequency sin confirmarlos.","activity":"Marca cinco referencias y escribe para cada una el hecho, la hipótesis y cómo la revisarás.","deliverable":"Gráfico anotado y tabla de cinco referencias.","sources":["tv","oi"],"quiz":[{"id":"5-1","prompt":"Ves un área destacada en un mapa de OI. ¿Qué debes verificar antes de usarla?","options":["La paleta de colores","Que corresponda exactamente al máximo anterior","Subyacente, vencimiento, unidad y fecha de corte"],"correct":2,"explanation":"Una referencia puede representar otro mercado, unidad o conjunto de contratos.","reference":"Clase 5","kind":"Aplicación"},{"id":"5-2","prompt":"¿Cuál es una observación de gráfico?","options":["El máximo de la vela anterior fue 100","La próxima vela subirá","Un participante defendió ese nivel"],"correct":0,"explanation":"El máximo observado puede leerse del gráfico sin atribuir una intención.","reference":"Clase 5","kind":"Criterio"}]},{"id":6,"week":3,"month":1,"title":"Introducción a Wyckoff y mercado eficiente","level":"Básico","videos":["I1"],"videoKind":"principal","goal":"Relacionar rango, precio y volumen al formular una lectura de Wyckoff.","summary":"Wyckoff usa la interacción entre esfuerzo y resultado como marco de lectura. Un volumen elevado con poco desplazamiento puede señalar oposición, pero la etiqueta de acumulación o distribución requiere contexto y evidencia posterior. La eficiencia del mercado es un marco distinto para pensar cómo se incorpora información.","previous":"Referencias gráficas de la clase 5.","concepts":["Wyckoff","Acumulación","Distribución","Esfuerzo y resultado"],"steps":["Identifica tendencia previa y límites del rango.","Compara desplazamiento y volumen en bordes y rupturas.","Escribe dos hipótesis y fija la evidencia que discriminaría entre ellas."],"example":"Si una vela rompe el mínimo con volumen alto y cierra dentro del rango, puedes plantear rechazo. También puede ser una pausa antes de continuar hacia abajo.","tip":"Contrasta gráficos similares que terminaron con resultados distintos.","error":"Nombrar cualquier lateralidad como acumulación y buscar explicaciones solo después de ver el desenlace.","activity":"Selecciona tres rangos históricos y justifica qué evidencia favorece cada hipótesis.","deliverable":"Tres gráficos con evidencia a favor, en contra y estado por confirmar.","sources":["oi"],"quiz":[{"id":"6-1","prompt":"Alto volumen con muy poco avance. ¿Qué interpretación es razonable?","options":["Distribución garantizada","Podría haber oposición y falta contrastar el contexto","El volumen confirma una entrada"],"correct":1,"explanation":"La comparación esfuerzo y resultado genera una hipótesis que requiere contexto.","reference":"Clase 6","kind":"Aplicación"},{"id":"6-2","prompt":"¿Cómo revisas tu hipótesis de acumulación sin mirar el futuro?","options":["Eliges solo un caso que acabó al alza","Borras el rango previo","Fijas una condición observable y avanzas en replay"],"correct":2,"explanation":"La condición fijada antes del desenlace permite evaluar la hipótesis sin anticipación.","reference":"Clase 6","kind":"Criterio"}]},{"id":7,"week":4,"month":1,"title":"Wyckoff avanzado y lectura de contexto","level":"Básico","videos":["I2","I3"],"videoKind":"principal","goal":"Definir confirmación e invalidación para varias lecturas de una misma estructura.","summary":"Los eventos de Wyckoff orientan una hipótesis. Para probarla, traduce aceptación, rechazo y retesteo a observaciones verificables y conserva una alternativa. La ubicación en marco mayor condiciona la interpretación del mismo patrón.","previous":"Marco y lectura de Wyckoff de la clase 6.","concepts":["Confirmación","Invalidación","Retesteo","Contexto"],"steps":["Congela el gráfico antes de una ruptura y marca el rango.","Redacta escenarios alcista, bajista y neutral con criterios observables.","Avanza vela por vela y anota cuál condición apareció primero."],"example":"Un cierre fuera del límite y un retesteo que se sostiene son dos observaciones diferentes. Una sola mecha al exterior satisface un criterio distinto.","tip":"Define cuántos cierres o qué referencia usarás antes del replay.","error":"Mover el nivel invalidante cada vez que cambia el precio.","activity":"Formula tres escenarios para el mismo gráfico y registra qué hipótesis sobrevivió al replay.","deliverable":"Mapa de escenarios con gatillo, invalidación y resultado observado.","sources":["tv"],"quiz":[{"id":"7-1","prompt":"¿Qué frase define una invalidación reproducible?","options":["Si hay dos cierres bajo el suelo del rango, descarto el escenario","Si el gráfico luce débil","Si encuentro un indicador contrario"],"correct":0,"explanation":"La referencia y los cierres se pueden verificar en el gráfico.","reference":"Clase 7","kind":"Aplicación"},{"id":"7-2","prompt":"¿Por qué redactar un escenario neutral?","options":["Porque siempre debe haber tres operaciones","Porque puede faltar la condición de activación","Porque invalida todas las tendencias"],"correct":1,"explanation":"El escenario neutral permite esperar cuando falta evidencia suficiente.","reference":"Clase 7","kind":"Comprensión"}]},{"id":8,"week":4,"month":1,"title":"Indicadores, bandas, watchlist y macro","level":"Básico","videos":["I4","I7"],"videoKind":"principal","goal":"Construir una watchlist y explicar para qué sirve un indicador en el contexto de la sesión.","summary":"Un indicador transforma datos pasados con reglas y parámetros. Las bandas resumen referencias de alcance según su método. El calendario y la watchlist ayudan a anticipar ventanas de liquidez o eventos, pero su efecto depende del instrumento y la sesión.","previous":"Zonas y escenario escrito de las clases 5 y 7.","concepts":["Indicadores","Bandas","Watchlist","Calendario"],"steps":["Documenta qué dato usa el indicador, su periodo y su unidad.","Compara dos configuraciones en el mismo periodo histórico.","Organiza una watchlist y convierte eventos a tu zona horaria, conservando la hora de la fuente."],"example":"Una banda de periodo corto puede reaccionar antes que una larga ante el mismo movimiento. Esa sensibilidad también puede aumentar el ruido.","tip":"Usa una lista corta de activos con una pregunta concreta por símbolo.","error":"Tomar un cruce como señal automática o confundir hora del gráfico con hora del evento.","activity":"Construye una watchlist y un calendario de siete días con acciones de observación ante eventos.","deliverable":"Watchlist, agenda y ficha de un indicador.","sources":["tv"],"quiz":[{"id":"8-1","prompt":"¿Qué sucede al acortar el periodo de algunas bandas?","options":["Se vuelve una señal garantizada","Se elimina el ruido de mercado","Puede aumentar la sensibilidad al movimiento reciente"],"correct":2,"explanation":"La sensibilidad depende del método y del dato que usa.","reference":"Clase 8","kind":"Aplicación"},{"id":"8-2","prompt":"¿Qué debes registrar al preparar el calendario?","options":["Hora, zona horaria, fuente e instrumentos relevantes","Solo el color del evento","Precio de entrada para cada evento"],"correct":0,"explanation":"La hora y la fuente permiten ubicar el evento en la sesión correcta.","reference":"Clase 8","kind":"Criterio"}]},{"id":9,"week":5,"month":2,"title":"Análisis de varios mercados","level":"Intermedio","videos":["I8","I9","I10"],"videoKind":"principal","goal":"Comparar tres instrumentos y describir coincidencias sin asumir causalidad.","summary":"Alinea fechas, horarios y ventanas antes de comparar retornos. La correlación depende de la muestra y puede cambiar. Usa estacionalidad y datos de opciones para formular preguntas con fuente y fecha de corte.","previous":"Watchlist y agenda de la clase 8.","concepts":["Correlación","Estacionalidad","Ventana","Intermercado"],"steps":["Define qué relación quieres contrastar y selecciona instrumentos líquidos.","Sincroniza sesiones y compara variaciones porcentuales sobre la misma base.","Documenta coincidencias, diferencias y posibles explicaciones con nivel de confianza."],"example":"Dos instrumentos pueden moverse juntos en la apertura y separarse tras un evento. Un promedio semanal puede ocultar esa diferencia.","tip":"Marca divergencias de horario y rollover antes de comparar series.","error":"Usar movimientos en puntos como si fueran comparables entre instrumentos de escalas distintas.","activity":"Redacta un informe diario de tres activos. Incluye qué mirarás si la relación habitual cambia.","deliverable":"Informe con fecha, tabla de tres activos, escenarios y fuentes.","sources":["futuros","tv"],"quiz":[{"id":"9-1","prompt":"Dos activos tuvieron correlación alta el mes pasado. ¿Qué afirmación es razonable?","options":["Uno causó todos los movimientos del otro","La relación describe esa muestra y conviene revisar si cambia","La relación se mantendrá el siguiente mes"],"correct":1,"explanation":"La correlación histórica depende de la ventana y no prueba causalidad.","reference":"Clase 9","kind":"Aplicación"},{"id":"9-2","prompt":"¿Qué compararías entre dos activos con escalas distintas?","options":["Volumen sin unidades","El rango en puntos sin conversión","Retornos de una ventana y sesión alineadas"],"correct":2,"explanation":"Las variaciones relativas comparables evitan confundir escala con comportamiento.","reference":"Clase 9","kind":"Criterio"}]},{"id":10,"week":5,"month":2,"title":"Anomalías, divergencias y reconocimiento semanal","level":"Intermedio","videos":["I14","I16","I11"],"videoKind":"principal","goal":"Medir divergencias comparables y registrar también los casos sin valor informativo.","summary":"Hay divergencia cuando instrumentos comparables se comportan distinto bajo un criterio explícito. Describe al inicio qué es una anomalía para tu muestra. Clasifica el resultado en vez de asumir que la divergencia predice un giro.","previous":"Comparación de ventanas de la clase 9.","concepts":["Divergencia","Anomalía","Máximo relativo","Sesgo de selección"],"steps":["Elige dos índices, un ancla común y una sesión comparable.","Define por escrito qué cuenta como nuevo máximo y qué cuenta como no confirmación.","Registra diez casos y clasifica el desenlace con el mismo horizonte."],"example":"Si un índice supera su máximo de ayer y otro no lo hace en la misma ventana, eso cumple una definición posible de divergencia. La continuación y el giro son desenlaces a medir.","tip":"Incluye ejemplos en que la divergencia no mejoró el escenario.","error":"Comprobar solo los giros que recuerdas o mezclar datos de distintas sesiones.","activity":"Clasifica diez divergencias históricas con criterio fijo y un resultado observable.","deliverable":"Tabla de diez casos, criterio y conclusión provisional.","sources":["tv"],"quiz":[{"id":"10-1","prompt":"¿Qué caso debe conservar un estudio de divergencias?","options":["Uno que cumple el criterio aunque no anticipó un giro","Solo el caso que terminó en reversión","Solo el caso con mayor ganancia"],"correct":0,"explanation":"Los casos sin giro permiten estimar la utilidad real del criterio.","reference":"Clase 10","kind":"Aplicación"},{"id":"10-2","prompt":"¿Qué requisito permite comparar máximos relativos?","options":["Usar horarios de sesiones distintos","Alinear la referencia temporal de ambos instrumentos","Medir un máximo antes de la apertura y otro al cierre"],"correct":1,"explanation":"Los máximos comparados deben corresponder a la misma definición y ventana.","reference":"Clase 10","kind":"Criterio"}]},{"id":11,"week":6,"month":2,"title":"Ubicación de secuencia y modelo de entrada","level":"Intermedio","videos":["I18","I17","I15","I12","I13"],"videoKind":"principal","goal":"Convertir una idea de entrada en reglas observables y repetibles.","summary":"Una configuración necesita contexto, ubicación, secuencia, activación e invalidación. Las reglas deben poder aplicarse antes de conocer el desenlace. Un patrón solo adquiere respaldo tras evaluar casos comparables y costos.","previous":"Escenarios y divergencias de las clases 7 a 10.","concepts":["Setup","Ubicación","Activación","Entrada","Invalidación"],"steps":["Escribe dónde buscarás el patrón y qué situaciones lo excluyen.","Precisa gatillo, precio de referencia, stop y manejo de salida.","Aplica las reglas en veinte cortes históricos y marca descartes."],"example":"Si el plan exige cierre fuera de rango y retesteo, tocar el límite sin cierre queda descartado aunque el precio luego avance.","tip":"Usa el mismo criterio para ganadoras, perdedoras y descartes.","error":"Entrar por parecido visual o ajustar la regla a mitad de la muestra sin etiquetar la versión.","activity":"Documenta veinte ejemplos históricos de una configuración con captura, criterio, resultado y exclusiones.","deliverable":"Ficha de estrategia y matriz de veinte ejemplos.","sources":["tv"],"quiz":[{"id":"11-1","prompt":"El plan exige cierre fuera y retesteo. Solo hubo una mecha fuera. ¿Cómo lo anotas?","options":["Entrada válida si ganó","Operación obligatoria","Descarte por falta de activación"],"correct":2,"explanation":"Clasifica la observación con la regla escrita antes del resultado.","reference":"Clase 11","kind":"Aplicación"},{"id":"11-2","prompt":"¿Qué permite evaluar un setup?","options":["Fijar ubicación, gatillo e invalidación observables","Elegir el stop tras ver la salida","Usar solo imágenes favorables"],"correct":0,"explanation":"La definición reproducible permite evaluar casos favorables y adversos.","reference":"Clase 11","kind":"Criterio"}]},{"id":12,"week":7,"month":2,"title":"Gestión cuantitativa del riesgo","level":"Intermedio","videos":["P6"],"videoKind":"apoyo","goal":"Calcular riesgo, costos y contratos enteros bajo un presupuesto elegido para simulación.","summary":"El riesgo planificado suma distancia en ticks por valor del tick y contratos, más comisiones y slippage estimados. Lleva control del límite diario, la exposición conjunta y el drawdown. Un stop puede ejecutarse peor y los costos modifican el tamaño compatible con tu presupuesto.","previous":"Ticks de la clase 1 y reglas de invalidación de la clase 11.","concepts":["Riesgo monetario","Stop","Contratos","Costos","Drawdown"],"steps":["Fija capital, presupuesto y límite diario restante.","Convierte el stop a ticks con la ficha del instrumento y agrega costo estimado de ida y vuelta por contrato.","Compara el total con ambos límites y registra el margen. Simula un deslizamiento mayor."],"example":"Con 10 ticks, USD 2 por tick y USD 3 de costo por contrato, dos contratos estiman USD 46 de riesgo. Con presupuesto USD 40, el escenario planteado lo supera en USD 6.","tip":"Prueba costos altos y evalúa exposiciones correlacionadas en conjunto.","error":"Redondear hacia arriba el número de contratos o tratar el margen como presupuesto de riesgo.","activity":"Resuelve cinco escenarios. Incluye uno donde ni un contrato encaje en el presupuesto.","deliverable":"Hoja de cinco cálculos y supuestos, con el caso fuera de presupuesto.","sources":["pnl","riesgo"],"quiz":[{"id":"12-1","prompt":"Con 10 ticks, USD 2 por tick, USD 3 de costos por contrato y dos contratos, ¿qué riesgo estimas?","options":["USD 40","USD 46","USD 26"],"correct":1,"explanation":"Cada contrato arriesga USD 23. Dos contratos suman USD 46.","reference":"Clase 12","kind":"Aplicación"},{"id":"12-2","prompt":"El límite restante es USD 18, el coste de un contrato con stop es USD 23. ¿Cuántos contratos enteros caben bajo ese límite?","options":["Dos","Uno","Cero"],"correct":2,"explanation":"Un solo contrato excede el presupuesto por USD 5.","reference":"Clase 12","kind":"Comprensión"}]},{"id":13,"week":7,"month":2,"title":"Backtesting manual y validación","level":"Intermedio","videos":["I15"],"videoKind":"apoyo","goal":"Reproducir una estrategia sobre datos históricos y medir métricas netas con sus límites.","summary":"Un backtest manual aplica reglas fijas sobre datos históricos y registra ejecutadas y descartadas. Controla selección y anticipación, resta costos y reserva un tramo para contrastar. Treinta ejemplos son un punto de partida pedagógico.","previous":"Ficha de la clase 11 y costos de la clase 12.","concepts":["Backtesting","Expectativa","Profit factor","Sobreajuste"],"steps":["Define mercado, periodo, criterio de muestreo y versión de reglas.","Avanza con el futuro oculto y registra entrada, salida, R y costos.","Calcula estadísticas netas y contrasta un periodo distinto sin reajustar primero."],"example":"Resultados netos de +2R, −1R y −1R dan expectativa 0R y profit factor 1, si cada R usa una base comparable para esta ilustración.","tip":"Compara una muestra de desarrollo y otra de validación cronológicamente posterior.","error":"Excluir días incómodos o elegir parámetros usando todo el histórico.","activity":"Registra al menos treinta ejemplos y escribe tres posibles fuentes de sesgo.","deliverable":"Tabla con métricas netas, tramo de validación y conclusiones preliminares.","sources":["tv","riesgo"],"quiz":[{"id":"13-1","prompt":"¿Qué protege contra sesgo de anticipación?","options":["Registrar cada decisión con las velas futuras ocultas","Elegir solo ejemplos de un informe posterior","Definir la salida con el resultado visible"],"correct":0,"explanation":"El replay debe conservar la información disponible al decidir.","reference":"Clase 13","kind":"Aplicación"},{"id":"13-2","prompt":"Cuatro resultados netos en unidades comparables son +3, −1, +1 y −1. ¿Cuál es la expectativa por operación?","options":["0,25","0,50","2,00"],"correct":1,"explanation":"La suma neta es 2. Divídela entre 4 operaciones.","reference":"Clase 13","kind":"Criterio"}]},{"id":14,"week":8,"month":2,"title":"Ejecución en simulador","level":"Intermedio","videos":["P7","P1","P2"],"videoKind":"apoyo","goal":"Practicar cinco sesiones con órdenes y revisión en una cuenta simulada.","summary":"La simulación comprueba si puedes seguir un plan con el entorno en movimiento. Anota también las sesiones sin entrada. Los fills y la presión de operar en real pueden diferir de la simulación.","previous":"Reglas, costos y manejo de órdenes de las clases 2, 11 y 12.","concepts":["Simulador","Replay","Plan","Registro"],"steps":["Verifica que la cuenta esté en modo simulado y completa el checklist premercado.","Ejecuta solo los casos que cumplen el plan y captura la evidencia antes y después.","Registra operaciones, descartes y cambios de stop. Repite en cinco sesiones."],"example":"Un día sin activación puede cerrar con adherencia completa si el plan pedía esperar y así quedó documentado.","tip":"Mantén tamaño y reglas simuladas constantes para poder comparar el proceso.","error":"Contar solo días con operaciones o modificar el plan para recuperar una pérdida.","activity":"Completa cinco sesiones simuladas y registra las decisiones de operar y de esperar.","deliverable":"Cinco sesiones con plan, captura y reflexión.","sources":["ninja"],"quiz":[{"id":"14-1","prompt":"La sesión no presentó tu setup. ¿Cómo la documentas?","options":["La descartas como dato","Registras una operación supuesta","Registras una sesión sin operación y el motivo"],"correct":2,"explanation":"La decisión de esperar cumple un plan que exige activación.","reference":"Clase 14","kind":"Aplicación"},{"id":"14-2","prompt":"¿Qué comprobación debe venir antes de enviar órdenes de práctica?","options":["Verificar la cuenta activa de simulador","Duplicar el número de contratos","Abrir la pantalla de métricas"],"correct":0,"explanation":"La cuenta activa determina dónde se envía la orden.","reference":"Clase 14","kind":"Criterio"}]},{"id":15,"week":8,"month":2,"title":"Estadísticas y disciplina","level":"Intermedio","videos":["P4"],"videoKind":"apoyo","goal":"Distinguir calidad de ejecución y rentabilidad de la muestra.","summary":"Las métricas de resultado describen una muestra. El porcentaje de adherencia y el registro de errores explican si ejecutaste el método que querías evaluar. Segmenta por violaciones, setup y sesión.","previous":"Cinco sesiones simuladas y backtest inicial de las clases 13 y 14.","concepts":["Win rate","Adherencia","Expectativa","Drawdown"],"steps":["Verifica costos, datos faltantes y salidas en el diario.","Calcula métricas netas y separa operaciones dentro y fuera del plan.","Elige un error repetido y define una medida observable para la siguiente semana."],"example":"Una operación con ganancia después de ampliar el stop puede sumar P&L y reducir adherencia. El plan de mejora prioriza la desviación documentada.","tip":"Reporta el número de observaciones junto a cada métrica.","error":"Atribuir una buena racha a una ventaja que la muestra aún no permite sostener.","activity":"Revisa cinco sesiones y redacta qué repetirás, qué corregirás y cómo lo medirás.","deliverable":"Informe con estadísticas, evidencia y una acción de mejora.","sources":["riesgo"],"quiz":[{"id":"15-1","prompt":"Una operación ganó, pero el stop se amplió fuera del plan. ¿Cómo la registras?","options":["Como adherente porque ganó","Ganadora y con incumplimiento del plan","Como pérdida monetaria"],"correct":1,"explanation":"Rentabilidad y adherencia miden cosas distintas.","reference":"Clase 15","kind":"Aplicación"},{"id":"15-2","prompt":"Tres de cuatro operaciones siguieron el plan. ¿Qué adherencia observaste?","options":["25%","50%","75%"],"correct":2,"explanation":"Divide 3 entre 4 y conserva el tamaño de muestra.","reference":"Clase 15","kind":"Criterio"}]},{"id":16,"week":9,"month":3,"title":"Cómo funcionan las opciones","level":"Avanzado","videos":["A1"],"videoKind":"principal","goal":"Calcular el payoff de una opción comprada y distinguir contratos sobre índice, ETF y futuros.","summary":"Una call confiere el derecho de compra y una put, de venta, según el contrato. Al vencimiento, resta la prima y costos del valor intrínseco para estimar el resultado de una posición comprada. SPX liquida en efectivo con estilo europeo, SPY entrega acciones del ETF y admite ejercicio anticipado. En opciones sobre futuros, consulta el futuro subyacente, estilo y liquidación de cada serie.","previous":"Contrato y nocional de la clase 1.","concepts":["Call","Put","Strike","Prima","Ejercicio","Asignación"],"steps":["Identifica subyacente, vencimiento, strike, prima, multiplicador y liquidación.","Clasifica ITM, ATM y OTM y separa intrínseco de extrínseco.","Calcula ganancia o pérdida al vencimiento en tres precios terminales y compara fichas de SPX, SPY y una opción sobre futuros."],"example":"Call comprada con strike 100 y prima 4 por unidad. Si el subyacente termina en 110, el resultado antes de costos es +6 por unidad. Una put con el mismo strike y prima vale −4 netos si termina en 110.","tip":"Distingue el perfil al vencimiento del valor de la prima antes de vencer.","error":"Usar las reglas de asignación de SPY para SPX o ignorar el multiplicador de la serie.","activity":"Traza call y put compradas en tres escenarios y compara los tres productos en una tabla.","deliverable":"Payoffs con unidades, fichas y comparación de ejercicio y liquidación.","sources":["cboe","opciones","occ"],"quiz":[{"id":"16-1","prompt":"Call comprada con strike 100, prima 4 y precio final 110. ¿Qué resultado hay por unidad antes de costos?","options":["+6","+10","−4"],"correct":0,"explanation":"El valor intrínseco es 10. Al restar la prima queda +6.","reference":"Clase 16","kind":"Aplicación"},{"id":"16-2","prompt":"¿Qué distingue las opciones sobre SPX de las opciones estándar sobre SPY?","options":["Ambas entregan acciones al vencimiento","SPX liquida en efectivo y SPY entrega acciones del ETF","Ambas tienen ejercicio europeo"],"correct":1,"explanation":"SPX es una opción de índice de estilo europeo. SPY es una opción sobre un ETF con ejercicio americano.","reference":"Clase 16","kind":"Comprensión"}]},{"id":17,"week":9,"month":3,"title":"Greeks, volatilidad y Expected Move","level":"Avanzado","videos":["A2","A6"],"videoKind":"principal","goal":"Interpretar sensibilidades y construir un rango implícito con supuestos claros.","summary":"Delta aproxima el cambio local de la prima con el precio, gamma el cambio de delta, theta la sensibilidad al tiempo y vega la sensibilidad a la volatilidad implícita. El expected move depende del método, vencimiento y convención temporal.","previous":"Payoff, prima y vencimiento de la clase 16.","concepts":["Delta","Gamma","Theta","Vega","Skew","Volatilidad implícita"],"steps":["Compara dos strikes con el mismo vencimiento y fija las unidades reportadas.","Aísla cambios de precio, tiempo e IV en tres escenarios.","Calcula una aproximación por IV anualizada y declara el uso de días de negociación o calendario según tu fuente."],"example":"Con precio 100, IV anual de 20% y un año de 252 sesiones, el movimiento de una sesión estimado con 100 × 0,20 × √(1/252) es ≈ 1,26 unidades. Es un rango de modelo, no una barrera.","tip":"Compara el método por IV con la convención de la herramienta del video y anota discrepancias.","error":"Sumar Greeks como si fueran constantes para grandes cambios o leer el rango como un resultado seguro.","activity":"Crea tres escenarios aislados de precio, tiempo e IV y explica por qué cambia la prima.","deliverable":"Matriz con dirección del cambio, sensibilidad relevante y convención temporal.","sources":["greeks","iv"],"quiz":[{"id":"17-1","prompt":"¿Cuál aproxima el cambio de delta ante un cambio pequeño del subyacente?","options":["Theta","Vega","Gamma"],"correct":2,"explanation":"Gamma mide la sensibilidad de delta.","reference":"Clase 17","kind":"Aplicación"},{"id":"17-2","prompt":"¿Qué debes informar al usar un expected move estimado con IV?","options":["Método, hora, horizonte y convención de días","Que el rango es máximo y mínimo futuro","Que describe el payoff de cualquier opción"],"correct":0,"explanation":"El rango depende de la IV y de cómo anualizas el plazo.","reference":"Clase 17","kind":"Criterio"}]},{"id":18,"week":10,"month":3,"title":"Open Interest y órdenes atrapadas","level":"Avanzado","videos":["A3"],"videoKind":"principal","goal":"Comparar Open Interest y volumen e interpretar zonas sin inferir quién tiene exposición neta.","summary":"El volumen cuenta contratos negociados en una ventana. El OI cuenta contratos que siguen abiertos a un corte. Cada contrato abierto tiene comprador y vendedor, por lo que el OI por sí solo no revela la dirección del mercado o la exposición neta de un actor.","previous":"Prima y vencimiento de la clase 16.","concepts":["Open Interest","Volumen","Strike","Max Pain"],"steps":["Comprueba mercado, fecha, vencimiento y unidad del dato.","Compara volumen y OI en dos cortes y distingue aperturas, cierres y traspasos posibles.","Escribe una hipótesis de zona y qué evidencia adicional la ayudaría a contrastar."],"example":"Diez contratos negociados aumentan el volumen en diez. Si todas las operaciones transfieren posiciones de un participante a otro, el OI puede quedar igual.","tip":"Conserva la hora de publicación y revisa si el OI era conocido al momento del análisis.","error":"Tomar el strike con más OI o Max Pain como objetivo fijo de precio.","activity":"Compara dos mapas del mismo subyacente y vencimiento. Escribe una inferencia válida y dos que el dato no permite.","deliverable":"Mapas fechados y tabla de cambios.","sources":["oi","oiDatos"],"quiz":[{"id":"18-1","prompt":"Se registra volumen de diez contratos que solo transfieren posiciones entre participantes. ¿Qué puede pasar con el OI?","options":["Aumenta necesariamente en diez","Puede mantenerse igual","Se vuelve cero"],"correct":1,"explanation":"El volumen cuenta las ejecuciones. El OI solo cambia con el efecto neto en contratos abiertos.","reference":"Clase 18","kind":"Aplicación"},{"id":"18-2","prompt":"¿Qué afirma por sí solo el OI de un strike?","options":["Quién está netamente largo","Que el precio cerrará allí","El número de contratos abiertos en ese corte"],"correct":2,"explanation":"Cada contrato abierto tiene dos lados. El dato agregado no identifica exposición neta individual.","reference":"Clase 18","kind":"Comprensión"}]},{"id":19,"week":10,"month":3,"title":"Gamma Flip y Gamma Exposure","level":"Avanzado","videos":["A4","A7"],"videoKind":"principal","goal":"Leer el Gamma Flip, GEX y las zonas Call Wall y Put Wall como estimaciones dependientes del modelo.","summary":"GEX agrega gamma bajo supuestos de posición, ponderación y unidad. El Gamma Flip es el punto donde el modelo cruza cero para el rango evaluado. La reacción de cobertura y los muros estimados dependen de los datos y del método del proveedor.","previous":"Greeks y límites de OI de las clases 17 y 18.","concepts":["Gamma Exposure","Gamma Flip","Dealer","Call Wall","Put Wall"],"steps":["Registra proveedor, unidad, vencimientos y supuestos sobre quién mantiene la posición.","Marca el cruce estimado y las concentraciones por strike.","Repite la lectura con una fecha o corte diferente y anota qué cambió."],"example":"Un modelo didáctico muestra GEX de −3 bajo 99 y +2 sobre 101. Esto describe un cambio de signo estimado en el intervalo, sin demostrar una reacción del mercado.","tip":"Presenta los niveles como referencias condicionadas e indica cuándo se recalcularon.","error":"Convertir Call Wall y Put Wall en soportes garantizados o identificar posiciones privadas a partir del OI.","activity":"Construye un mapa educativo y explica qué sugiere, qué evidencia falta y qué lo invalidaría.","deliverable":"Mapa con supuestos, límites y escenario alternativo.","sources":["cboe","greeks"],"quiz":[{"id":"19-1","prompt":"¿Qué describe un Gamma Flip estimado?","options":["El nivel donde el modelo agrega una exposición cercana a cero y cambia de signo","El stop de todos los dealers","Un nivel que necesariamente rebota"],"correct":0,"explanation":"El cruce es una estimación condicionada por insumos y supuestos del proveedor.","reference":"Clase 19","kind":"Aplicación"},{"id":"19-2","prompt":"Dos proveedores reportan GEX distinto. ¿Qué revisas primero?","options":["Cuál coincide con tu idea de entrada","Unidades, vencimientos, hora y supuestos de posición","Solo la cantidad de colores"],"correct":1,"explanation":"Las metodologías y universos de datos pueden diferir.","reference":"Clase 19","kind":"Criterio"}]},{"id":20,"week":11,"month":3,"title":"Option Flow y Order Flow","level":"Avanzado","videos":["A5","A8"],"videoKind":"principal","goal":"Separar transacciones observadas de hipótesis sobre intención en dos mercados vinculados.","summary":"Order Flow examina órdenes, cotizaciones o ejecuciones según el feed. Option Flow agrupa negociaciones en series de opciones. Una impresión puede ser parte de un spread, una cobertura, una apertura o un cierre. El dato observado y su interpretación deben quedar separados.","previous":"OI, IV y strike de las clases 16 a 19.","concepts":["Order Flow","Option Flow","Absorción","Imbalance","Overnight"],"steps":["Verifica mercado, hora, vencimiento y calidad de cada feed.","Registra precio, volumen y reacción. Añade IV y ATM si el instrumento lo amerita.","Formula dos explicaciones que encajen y precisa qué dato permitiría elegir entre ellas."],"example":"Un lote grande de calls cerca del ask puede indicar agresión compradora en esa pierna. Aún puede ser cobertura o parte de otra estructura.","tip":"Usa el mismo huso horario para comparar ambos flujos.","error":"Interpretar tamaño alto como señal por sí solo o sumar volumen de mercados distintos sin normalizar.","activity":"Elige un caso histórico y separa hechos, interpretaciones, datos faltantes y decisión simulada.","deliverable":"Cuatro columnas de evidencia, hipótesis, dato pendiente y decisión.","sources":["oiDatos","occ"],"quiz":[{"id":"20-1","prompt":"Una compra aparente de calls se imprime cerca del ask. ¿Qué no puedes establecer solo con esa impresión?","options":["La hora registrada","La serie negociada","Si abre una posición direccional o cubre otra exposición"],"correct":2,"explanation":"Puede formar parte de una orden con varias patas o de una cobertura.","reference":"Clase 20","kind":"Aplicación"},{"id":"20-2","prompt":"¿Cómo contrastas Option Flow con Order Flow?","options":["Alineas mercado, hora y unidad y documentas el contexto","Sumas sus tamaños siempre","Tomas la impresión mayor como señal de ambos"],"correct":0,"explanation":"Los flujos pueden venir de instrumentos, unidades y relojes distintos.","reference":"Clase 20","kind":"Criterio"}]},{"id":21,"week":11,"month":3,"title":"Integración de contexto y escenario","level":"Avanzado","videos":["P7","A9","A10"],"videoKind":"principal","goal":"Preparar un informe premercado que conecte contexto, activación e invalidación.","summary":"La estructura define dónde mirar, opciones y flujos aportan contexto y el riesgo limita la ejecución simulada. Escribe antes de la sesión tanto el escenario base como las condiciones para esperar.","previous":"Plan de clase 4, riesgo de clase 12 y flujos de clase 20.","concepts":["Premercado","Escenarios","Fuentes","No operación"],"steps":["Recoge calendario, sesión overnight y referencias del marco mayor.","Identifica qué dato de opciones es pertinente para ese instrumento y por qué.","Redacta escenarios, invalidación, costos y condición de no operar. Revisa después qué ocurrió."],"example":"Instrumento en rango y dato de opciones sin actualizar. El plan puede exigir esperar la apertura y conservar el escenario neutral hasta tener un gatillo observable.","tip":"Fecha y hora cada fuente para poder reconstruir qué sabías antes de decidir.","error":"Añadir indicadores sin una pregunta o cambiar el escenario después de ver el resultado.","activity":"Escribe un informe de una página y justifica una posible operación y una decisión de esperar.","deliverable":"Informe premercado y contraste postmercado.","sources":["tv","oiDatos"],"quiz":[{"id":"21-1","prompt":"¿Qué haces si una referencia de opciones es vieja y no hay gatillo?","options":["Ordenas por correlación aproximada","Registras el dato viejo y sostienes el escenario de espera según el plan","Cambias al instrumento que más se movió"],"correct":1,"explanation":"La vigencia del dato y la condición de entrada forman parte de la decisión.","reference":"Clase 21","kind":"Aplicación"},{"id":"21-2","prompt":"¿Qué dato permite auditar el escenario premercado?","options":["Un resultado neto sin fecha","Una captura tomada días después","La hora de cada fuente y la hipótesis escrita antes de abrir"],"correct":2,"explanation":"La evidencia fechada ayuda a comprobar qué estaba disponible al decidir.","reference":"Clase 21","kind":"Criterio"}]},{"id":22,"week":12,"month":3,"title":"Observación de sesiones y replay","level":"Práctica","videos":["P1","P2","P3","P4","P5","P6"],"videoKind":"principal","goal":"Observar una sesión en replay con decisiones registradas antes del desenlace.","summary":"El replay permite detener el tiempo y reconstruir la información disponible. Registra contexto, ubicación, invalidación y gestión antes de revelar cada tramo. Separa las decisiones repetibles de las discrecionales.","previous":"Plan escrito y práctica en simulador de las clases 14 y 21.","concepts":["Replay","Sesgo de anticipación","Decisión","Discreción"],"steps":["Pausa antes del movimiento y escribe el escenario y la condición de entrada.","Continúa por tramos y registra los cambios junto con la evidencia nueva.","Compara tu ficha con lo observado y señala qué regla puedes replicar."],"example":"Si el stop solo parece obvio cuando ves la vela siguiente, esa ubicación no estaba justificada de la misma manera en tiempo real.","tip":"Conserva dos columnas, información disponible al decidir y explicación posterior.","error":"Copiar la entrada observada sin conocer contexto, costos o invalidación.","activity":"Completa la hoja de observación de dos sesiones, una con y otra sin ejecución si es posible.","deliverable":"Dos fichas con decisiones fechadas y reflexión.","sources":["ninja","tv"],"quiz":[{"id":"22-1","prompt":"¿Cuándo registras la invalidación en replay?","options":["Con el gráfico detenido antes de revelar el siguiente tramo","Al ver la salida del operador de la grabación","Cuando ya puedes explicar la ganancia"],"correct":0,"explanation":"La invalidación documentada antes del desenlace reduce el sesgo retrospectivo.","reference":"Clase 22","kind":"Aplicación"},{"id":"22-2","prompt":"¿Qué hace replicable una decisión durante el replay?","options":["El color de la vela siguiente","Que sus criterios y datos disponibles se puedan volver a observar","Que se parezca a una decisión de una grabación"],"correct":1,"explanation":"El criterio documentado permite reproducir la lectura con la misma información.","reference":"Clase 22","kind":"Criterio"}]},{"id":23,"week":12,"month":3,"title":"Simulación de evaluación de prop firm","level":"Práctica","videos":["P6"],"videoKind":"apoyo","goal":"Simular una evaluación con reglas explícitas y registrar incumplimientos.","summary":"Las evaluaciones de prop firm pueden usar pérdida diaria, drawdown estático o móvil, horario, tamaño, consistencia y restricciones por eventos. Define cómo se mide cada condición en una ficha tomada de reglas vigentes y ensáyala en simulador.","previous":"Riesgo calculado y cinco sesiones auditadas previamente.","concepts":["Prop firm","Drawdown estático","Trailing","Consistencia"],"steps":["Registra fuente, corte horario, base de cálculo, tamaño máximo y restricciones.","Completa el formulario de simulación y añade las condiciones restantes en el entregable.","Evalúa el límite al cierre y, si las reglas lo requieren, también el peor saldo intradía."],"example":"Si la regla ilustrativa fija un piso USD 300 debajo de un pico de USD 10 500, el piso móvil sería USD 10 200. La firma puede aplicar convenciones distintas.","tip":"Incluye comisión, slippage y momento de reinicio diario en tu ficha.","error":"Aplicar el drawdown de cierre a una regla intradía o reutilizar condiciones de otra firma.","activity":"Simula una evaluación con reglas que tú documentes. Registra fecha, saldos, pérdida diaria, tamaño y fallas.","deliverable":"Ficha de reglas, bitácora y resultado condicionado a los criterios definidos.","sources":["riesgo"],"quiz":[{"id":"23-1","prompt":"Drawdown móvil ilustrativo de USD 300 y pico de USD 10 500. ¿Cuál es el piso si la regla sigue ese pico?","options":["USD 10 800","USD 10 500","USD 10 200"],"correct":2,"explanation":"Resta la distancia de USD 300 al pico contemplado por la regla.","reference":"Clase 23","kind":"Aplicación"},{"id":"23-2","prompt":"Antes de simular, ¿qué debes confirmar sobre pérdida diaria y drawdown?","options":["Base de cálculo, horario y uso de saldo intradía o al cierre","Solo el objetivo de beneficio","Que todas las firmas usan las mismas reglas"],"correct":0,"explanation":"El resultado depende del momento y la base exacta que se usen.","reference":"Clase 23","kind":"Comprensión"}]},{"id":24,"week":12,"month":3,"title":"Evaluación final y Trading Playbook","level":"Práctica","videos":["P7"],"videoKind":"apoyo","goal":"Documentar un proceso trazable y demostrar aplicación en simulador con el Trading Playbook.","summary":"El playbook integra especificación, escenario, setup, gestión de riesgo, evidencia, estadísticas y revisión. Evalúa claridad, repetibilidad, control de pérdidas y calidad del registro. Una sola sesión ganadora aporta evidencia limitada.","previous":"Entregables de fundamentos, estrategia y evaluación simulada.","concepts":["Playbook","Protocolo","Evidencia","Revisión semanal"],"steps":["Completa el dossier con los dieciocho componentes requeridos.","Vincula ejemplos de backtesting y entradas del diario a la regla que ilustran.","Haz una revisión final, identifica brechas y define cómo medirás la mejora."],"example":"Regla evaluable: «Si falta el cierre de confirmación definido en este plan, registro un descarte». Una lista de capturas muestra si se aplicó de manera consistente.","tip":"Fecha cada versión y conserva las reglas previas al evaluar el cambio.","error":"Presentar una descripción vaga o reemplazar las pruebas por resultados seleccionados.","activity":"Completa el proyecto final y revisa la rúbrica con evidencias de gráficos, diario y estadísticas.","deliverable":"Trading Playbook completo, métricas y protocolo semanal.","sources":["futuros","riesgo","occ"],"quiz":[{"id":"24-1","prompt":"¿Qué evidencia hace más fácil auditar el playbook?","options":["Una captura de la ganancia mayor","Reglas versionadas vinculadas a casos del backtest y diario","Una lista de palabras técnicas"],"correct":1,"explanation":"Relacionar reglas y evidencia muestra cómo se aplicaron con datos comparables.","reference":"Clase 24","kind":"Aplicación"},{"id":"24-2","prompt":"¿Qué debería incluir el protocolo semanal?","options":["Solo P&L de la última sesión","Aumentar contratos si hubo ganancias","Revisión de adherencia, errores y una mejora medible"],"correct":2,"explanation":"El protocolo convierte los hallazgos en una acción de seguimiento.","reference":"Clase 24","kind":"Criterio"}]}],"videos":[{"id":"B1","drive":"1ElZq9h7PmffVqUxMLA7Vt8at_cqIAdK9","title":"Introducción a la teoría de los trimestres","summary":"Presenta el modelo de ciclos y sus fases. Estudiar antes de las entradas.","group":"Básico","status":"Resumen orientativo","order":1,"related":[3],"copy":"01 - Introduccion a la teoria de los trimestres.mp4"},{"id":"B2","drive":"15AlFWqynEYACdGYkRdSzP5vG2qvl0wdW","title":"Ciclos y estructura temporal fractal","summary":"Desarrolla lectura de ciclos en diferentes temporalidades.","group":"Básico","status":"Resumen orientativo","order":2,"related":[3],"copy":"02 - Ciclos y estructura temporal fractal.mp4"},{"id":"B3","drive":"1-5kGKJs5hry48MdatgJ2UMTZtc_20NcC","title":"Clase 1 · Marco general y plan de lectura","summary":"En pantalla se reconoce un proceso de seis pasos, desde big picture hasta plan de ejecución.","group":"Básico","status":"Verificado en pantalla","order":3,"related":[4],"copy":"03 - Clase 1 - Marco general y plan de lectura.mp4"},{"id":"B4","drive":"1nGTPjLrAB78Q9vHcXWicxPENEVX6XiYH","title":"Clase 2 · Parte 1","summary":"Se observan gráficos y herramientas de Open Interest Heatmap. Confirmar el desarrollo completo.","group":"Básico","status":"Verificado en pantalla","order":4,"related":[5],"copy":"04 - Clase 2 - Parte 1.mp4"},{"id":"B5","drive":"1ZZx6wRtjEJ5SAggMzR0BBNIZFUQFW6ws","title":"Clase 2 · Parte 2","summary":"Continuación de la clase anterior; ver después de la parte 1.","group":"Básico","status":"Resumen orientativo","order":5,"related":[5],"copy":"05 - Clase 2 - Parte 2.mp4"},{"id":"B6","drive":"1bvQ29A2pS0MufAPGlHRiVFPCRzF-KY7Q","title":"Clase 4 · Frequency módulo I","summary":"Material asociado a Frequency; tema detallado por confirmar al reproducir.","group":"Básico","status":"Pendiente de confirmar","order":6,"related":[5],"copy":"06 - Clase 4 - Frequency modulo I.mp4"},{"id":"B7","drive":"1Nliz0aW7KiAa4clLf3BIHCuiqCMfdaxV","title":"Clase 8 · Plataforma y entorno de futuros","summary":"
